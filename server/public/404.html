<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>404 · 页面不存在</title>
<style>
  body {
    min-height: 100vh;
    margin: 0;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 0% 0%, rgba(14, 165, 233, 0.06), transparent 50%),
      radial-gradient(circle at 100% 100%, rgba(20, 184, 166, 0.05), transparent 50%),
      #f8fafc;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 32px 16px;
  }
  .box {
    max-width: 520px;
    background: #fff;
    border-radius: 18px;
    padding: 40px 32px;
    box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
    border: 1px solid #e2e8f0;
    text-align: center;
  }
  .code {
    font-size: 72px;
    font-weight: 800;
    background: linear-gradient(135deg, #0EA5E9, #0284C7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0 0 4px;
    line-height: 1;
    letter-spacing: -0.04em;
  }
  h1 { margin: 8px 0 6px; font-size: 20px; color: #0F172A; letter-spacing: -0.01em; }
  p { margin: 6px 0; font-size: 14px; color: #64748B; line-height: 1.6; }
  .url {
    margin: 16px 0 24px;
    padding: 10px 14px;
    background: #F0F9FF;
    border-radius: 10px;
    font-family: 'JetBrains Mono', Menlo, monospace;
    font-size: 12px;
    color: #0284C7;
    word-break: break-all;
    border: 1px solid #7DD3FC;
  }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: all .15s;
    cursor: pointer;
    border: 1px solid #E2E8F0;
    background: #fff;
    color: #475569;
  }
  .btn:hover { border-color: #7DD3FC; color: #0EA5E9; background: #F0F9FF; }
  .btn.primary {
    background: #0EA5E9;
    color: #fff;
    border: 0;
    box-shadow: 0 1px 2px rgba(14, 165, 233, 0.2);
  }
  .btn.primary:hover { opacity: .9; color: #fff; background: #0284C7; }
  ul { text-align: left; font-size: 13px; color: #64748B; padding-left: 18px; line-height: 1.7; }
  li { margin: 6px 0; }
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>页面找不到了</h1>
  <p>您请求的资源不存在或已被移除。常见原因：</p>
  <ul>
    <li>链接被截断、含有不可见字符（如中文 URL 编码错误）</li>
    <li>页面已被删除或路径拼写错误</li>
    <li>登录态已过期，token 无效</li>
  </ul>
  <div class="url" id="cur-url">loading...</div>
  <div class="btns">
    <a class="btn primary" href="/admin/index.html">← 返回管理后台</a>
    <a class="btn" href="/admin/login.html">重新登录</a>
    <a class="btn" href="/">首页</a>
  </div>
</div>
<script>
  document.getElementById('cur-url').textContent = location.href;
</script>
</body>
</html>
