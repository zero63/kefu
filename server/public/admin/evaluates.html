<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>评价分析 · kefu 管理后台</title>
<link rel="stylesheet" href="/design-system.css" />
<link rel="stylesheet" href="/admin/admin2.css" />
<style>
.qf-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--color-muted); margin-bottom: 16px; }
.qf-tabs .tab { padding: 10px 20px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--color-text-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.qf-tabs .tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
.qf-tabs .tab:hover { color: var(--color-primary); }
.qf-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.qf-summary { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.qf-summary .item { padding: 10px 18px; border-radius: var(--r-md); min-width: 130px; }
.qf-summary .item .label { font-size: 11px; color: var(--color-text-2); }
.qf-summary .item .value { font-size: 22px; font-weight: 700; }
.qf-summary .item.bg-sat { background: linear-gradient(135deg, #D1FAE5, #A7F3D0); }
.qf-summary .item.bg-sat .value { color: #059669; }
.qf-summary .item.bg-neu { background: linear-gradient(135deg, #FEF3C7, #FDE68A); }
.qf-summary .item.bg-neu .value { color: #D97706; }
.qf-summary .item.bg-dis { background: linear-gradient(135deg, #FEE2E2, #FECACA); }
.qf-summary .item.bg-dis .value { color: #DC2626; }
.qf-summary .item.bg-avg { background: linear-gradient(135deg, #DDD6FE, #C4B5FD); }
.qf-summary .item.bg-avg .value { color: #7C3AED; }
.qf-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.qf-table th { background: #F8FAFC; color: var(--color-text-2); font-weight: 600; padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--color-muted); }
.qf-table td { padding: 8px 10px; border-bottom: 1px solid var(--color-muted); }
.qf-table tr:hover { background: #FAFAFF; }
.qf-page { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--color-muted); font-size: 13px; color: var(--color-text-2); }
.star-rating { color: #FBBF24; font-size: 14px; letter-spacing: 1px; }
.star-empty { color: #E5E7EB; }
.tag-sat { padding: 2px 8px; border-radius: 12px; background: #D1FAE5; color: #065F46; font-size: 11px; font-weight: 600; }
.tag-neu { padding: 2px 8px; border-radius: 12px; background: #FEF3C7; color: #92400E; font-size: 11px; font-weight: 600; }
.tag-dis { padding: 2px 8px; border-radius: 12px; background: #FEE2E2; color: #991B1B; font-size: 11px; font-weight: 600; }
.dist-bar { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.dist-bar .label { width: 80px; font-size: 13px; }
.dist-bar .bg-track { flex: 1; height: 14px; background: var(--color-muted); border-radius: 7px; overflow: hidden; }
.dist-bar .bg-fill { height: 100%; background: linear-gradient(90deg, #34D399, #10B981); border-radius: 7px; }
.dist-bar .count { width: 60px; text-align: right; font-size: 13px; }
.qf-col-pick { position: fixed; inset: 0; background: rgba(15,23,42,0.5); z-index: 9000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.qf-col-pick-box { background: var(--color-card); border-radius: var(--r-md); box-shadow: 0 24px 60px rgba(0,0,0,0.25); width: 520px; max-width: 92vw; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
.qf-col-pick-body { padding: 16px 18px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.qf-col-item { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 4px 8px; border-radius: var(--r-sm); }
.qf-col-item:hover { background: var(--color-primary-bg); }
.qf-sort-cursor { cursor: pointer; user-select: none; }
.qf-sort-cursor:hover { color: var(--color-primary); }
</style>
</head>
<body style="margin:0;padding:0;">

<div class="card">
  <div class="card-title">⭐ 评价分析
    <span class="extra">
      <button class="k-btn k-btn-mini" onclick="openColPicker()">⚙ 自定义列</button>
      <button class="k-btn k-btn-mini" onclick="exportCsv()">📥 导出 CSV</button>
    </span>
  </div>

  <!-- 评价 Tabs -->
  <div class="qf-tabs">
    <div class="tab active" data-tab="satisfaction" onclick="switchTab('satisfaction')">😊 满意度</div>
    <div class="tab" data-tab="detail" onclick="switchTab('detail')">📋 评分详情</div>
    <div class="tab" data-tab="trend" onclick="switchTab('trend')">📈 满意度趋势</div>
  </div>

  <!-- 时间工具条 -->
  <div class="qf-toolbar">
    <input id="fromDate" type="date" class="k-input" style="width:140px" />
    <span class="k-text-muted">~</span>
    <input id="toDate" type="date" class="k-input" style="width:140px" />
    <select id="preset" class="k-select" style="width:120px" onchange="onPresetChange()">
      <option value="">— 选预设 —</option>
      <option value="0">今日</option>
      <option value="1">昨日</option>
      <option value="3">最近 3 天</option>
      <option value="7" selected>最近 7 天</option>
      <option value="14">最近 14 天</option>
      <option value="30">最近 30 天</option>
    </select>
    <select id="groupBy" class="k-select" style="width:120px">
      <option value="agent" selected>按客服</option>
      <option value="total">全部汇总</option>
      <option value="score">按评分</option>
    </select>
    <input id="kw" class="k-input" placeholder="客服姓名" style="width:140px" />
    <button class="k-btn k-btn-primary" onclick="loadCurrent()">查询</button>
  </div>

  <!-- 摘要区 -->
  <div class="qf-summary" id="summary"></div>

  <!-- 评分分布（满意度 tab） -->
  <div id="distribution" style="margin-bottom:16px;"></div>

  <!-- 表格 -->
  <div id="table-box" style="overflow-x:auto;"></div>

  <div class="qf-page">
    <span id="page-info">共 0 条</span>
    <span>
      每页显示
      <select id="page-size" class="k-select" style="width:80px;display:inline-block" onchange="loadCurrent()">
        <option>10</option>
        <option selected>20</option>
        <option>50</option>
        <option>100</option>
      </select>
      <button class="k-btn k-btn-mini" onclick="changePage(-1)">上一页</button>
      <button class="k-btn k-btn-mini" onclick="changePage(1)">下一页</button>
    </span>
  </div>
</div>

<!-- 列选择弹窗 -->
<div id="col-modal" class="qf-col-pick" style="display:none;">
  <div class="qf-col-pick-box">
    <div class="qf-col-pick-header" style="padding:14px 18px;border-bottom:1px solid var(--color-muted);font-weight:600;">
      选择需要展示的数据项
      <button onclick="closeColPicker()" style="float:right;background:transparent;border:0;font-size:22px;color:var(--color-text-3);cursor:pointer;line-height:1;">×</button>
    </div>
    <div id="col-pick-body" class="qf-col-pick-body"></div>
    <div class="qf-col-pick-footer" style="padding:10px 18px;border-top:1px solid var(--color-muted);display:flex;justify-content:flex-end;gap:8px;">
      <button class="k-btn k-btn-mini k-btn-secondary" onclick="selectAllCols()">全选</button>
      <button class="k-btn k-btn-mini k-btn-secondary" onclick="resetColDefault()">默认</button>
      <button class="k-btn k-btn-mini k-btn-primary" onclick="applyColPicker()">应用</button>
      <button class="k-btn k-btn-mini" onclick="closeColPicker()">取消</button>
    </div>
  </div>
</div>

<script src="/admin/common.js?v=2026"></script>
<script>
if (!KefuAdmin.token) {
  if (parent && parent.KefuAdmin && parent.KefuAdmin.token) KefuAdmin.token = parent.KefuAdmin.token;
  else if (parent && parent.UI && parent.UI.token) KefuAdmin.token = parent.UI.token;
  else KefuAdmin.token = localStorage.getItem('kefu_token');
}
if (!KefuAdmin.token) { top.location.href = '/admin/login.html'; throw new Error('not logged in'); }
const A = KefuAdmin;

const COL_DEFS = {
  satisfaction: {
    label: '满意度',
    metrics: [
      { key: 'rank',              label: '排名', type: 'rank' },
      { key: 'agent_name',        label: '客服', type: 'name' },
      { key: 'total',             label: '总评', type: 'num', default: true },
      { key: 'satisfied_count',   label: '满意', type: 'num', default: true },
      { key: 'neutral_count',     label: '一般', type: 'num' },
      { key: 'bad_count',         label: '不满意', type: 'num' },
      { key: 'avg_score',         label: '平均分', type: 'num', default: true },
      { key: 'satisfaction_rate', label: '满意率', type: 'pct', default: true },
      { key: 'response_rate',     label: '回复率', type: 'pct' },
      { key: 'first_response_avg',label: '首响', type: 'sec' },
      { key: 'avg_response',      label: '平均响应', type: 'sec' },
    ],
  },
  detail: {
    label: '评分详情',
    metrics: [
      { key: 'created_at', label: '评价时间', type: 'time' },
      { key: 'agent_name', label: '客服', type: 'name' },
      { key: 'customer_id',label: '客户', type: 'name' },
      { key: 'score',      label: '评分', type: 'star', default: true },
      { key: 'level',      label: '等级', type: 'level', default: true },
      { key: 'session_id', label: '会话ID', type: 'code' },
      { key: 'comment',    label: '评价内容', type: 'text', default: true },
      { key: 'tags',       label: '标签', type: 'tags' },
    ],
  },
  trend: {
    label: '满意度趋势',
    metrics: [
      { key: 'date',             label: '日期', type: 'date', default: true },
      { key: 'total',            label: '总评', type: 'num', default: true },
      { key: 'satisfied_count',  label: '满意', type: 'num' },
      { key: 'neutral_count',    label: '一般', type: 'num' },
      { key: 'bad_count',        label: '不满意', type: 'num' },
      { key: 'avg_score',        label: '平均分', type: 'num', default: true },
      { key: 'satisfaction_rate',label: '满意率', type: 'pct', default: true },
      { key: 'reply_rate',       label: '回复率', type: 'pct' },
    ],
  },
};

let _activeTab = 'satisfaction';
let _page = 1, _pageSize = 20, _sortBy = null, _sortDir = 'desc';
let _visibleCols = {};
let _allRows = [];

function getDefaultVisible(tab) {
  const def = {};
  COL_DEFS[tab].metrics.forEach(m => { if (m.default) def[m.key] = true; });
  return def;
}

function onPresetChange() {
  const v = document.getElementById('preset').value;
  if (v === '') return;
  const days = parseInt(v, 10);
  let start, end;
  if (days === 0) { start = end = A.today(); }
  else if (days === 1) { start = end = A.daysAgo(1); }
  else { start = A.daysAgo(days - 1); end = A.today(); }
  document.getElementById('fromDate').value = start;
  document.getElementById('toDate').value = end;
  loadCurrent();
}

function switchTab(tab) {
  _activeTab = tab;
  _page = 1;
  document.querySelectorAll('.qf-tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  if (!_visibleCols[tab]) _visibleCols[tab] = getDefaultVisible(tab);
  loadCurrent();
}

function openColPicker() {
  const def = COL_DEFS[_activeTab];
  if (!def) return;
  const body = document.getElementById('col-pick-body');
  body.innerHTML = def.metrics.map(m => {
    const checked = _visibleCols[_activeTab][m.key] ? 'checked' : '';
    return '<label class="qf-col-item"><input type="checkbox" data-key="' + m.key + '" ' + checked + '/> ' + m.label + '</label>';
  }).join('');
  document.getElementById('col-modal').style.display = 'flex';
}
function closeColPicker() { document.getElementById('col-modal').style.display = 'none'; }
function selectAllCols() {
  document.querySelectorAll('#col-pick-body input[type=checkbox]').forEach(c => c.checked = true);
}
function resetColDefault() {
  const def = getDefaultVisible(_activeTab);
  document.querySelectorAll('#col-pick-body input[type=checkbox]').forEach(c => { c.checked = !!def[c.dataset.key]; });
}
function applyColPicker() {
  const map = {};
  document.querySelectorAll('#col-pick-body input[type=checkbox]').forEach(c => { map[c.dataset.key] = c.checked; });
  _visibleCols[_activeTab] = map;
  closeColPicker();
  loadCurrent();
}

function loadCurrent() {
  _page = 1;
  const start = document.getElementById('fromDate').value;
  const end = document.getElementById('toDate').value;
  const groupBy = document.getElementById('groupBy').value;
  const kw = document.getElementById('kw').value.trim();
  _pageSize = parseInt(document.getElementById('page-size').value, 10);
  if (!start || !end) { A.toast('请选择时间范围', 'error'); return; }
  loadData(start, end, groupBy, kw);
}

async function loadData(start, end, groupBy, kw) {
  // 加载 stats（含 distribution + by_agent）
  const statsR = await A.api('GET', '/api/admin/evaluate/stats?start_date=' + start + '&end_date=' + end);
  // 加载 list（详情）
  const listParams = new URLSearchParams({ page: 1, size: 100 });
  if (kw) listParams.set('keyword', kw);
  if (start) listParams.set('start_date', start);
  if (end) listParams.set('end_date', end);
  const listR = await A.api('GET', '/api/admin/evaluate/list?' + listParams);

  const stats = (statsR.data) || {};
  const detailList = (listR.data && listR.data.list) || [];
  renderSummary(stats, detailList);
  renderDistribution(stats);

  // 根据 tab 准备 rows
  if (_activeTab === 'satisfaction') {
    const arr = stats.by_agent || [];
    _allRows = arr.map((r, i) => ({
      rank: i + 1,
      agent_name: r.agent_name || ('#' + r.agent_id),
      total: r.total || 0,
      satisfied_count: r.satisfied || 0,
      neutral_count: r.neutral || 0,
      bad_count: r.dissatisfied || 0,
      avg_score: r.avg_score || 0,
      satisfaction_rate: r.total ? Math.round(r.satisfied / r.total * 100) : 0,
      response_rate: r.response_rate || 0,
      first_response_avg: r.first_response_avg || 0,
      avg_response: r.avg_response || 0,
    }));
  } else if (_activeTab === 'detail') {
    _allRows = detailList.map(x => ({
      created_at: x.created_at,
      agent_name: x.agent_name || ('#' + x.agent_id),
      customer_id: x.cust_id || ('#' + x.customer_id),
      score: x.score,
      level: x.level,
      session_id: x.session_id,
      comment: x.comment || '',
      tags: x.tags || '',
    }));
  } else if (_activeTab === 'trend') {
    _allRows = (stats.by_day || []).map(x => ({
      date: x.d,
      total: +x.cnt || 0,
      satisfied_count: +x.sat_count || 0,
      neutral_count: 0,
      bad_count: 0,
      avg_score: +x.avg_score || 0,
      satisfaction_rate: x.cnt ? Math.round(x.sat_count / x.cnt * 100) : 0,
      reply_rate: x.reply_rate || 0,
    }));
  }
  renderTable();
}

function renderSummary(stats, list) {
  const d = stats || {};
  document.getElementById('summary').innerHTML =
    '<div class="item bg-sat"><div class="label">😊 满意</div><div class="value">' + (d.satisfied || 0) + '</div></div>' +
    '<div class="item bg-neu"><div class="label">😐 一般</div><div class="value">' + (d.neutral || 0) + '</div></div>' +
    '<div class="item bg-dis"><div class="label">😞 不满意</div><div class="value">' + (d.dissatisfied || 0) + '</div></div>' +
    '<div class="item bg-avg"><div class="label">⭐ 平均分</div><div class="value">' + (d.avg_score || 0).toFixed(2) + '</div></div>' +
    '<div class="item bg-avg"><div class="label">📊 总评</div><div class="value">' + (d.total || 0) + '</div></div>' +
    '<div class="item bg-sat"><div class="label">满意率</div><div class="value">' + ((d.satisfaction_rate || 0)) + '%</div></div>';
}

function renderDistribution(stats) {
  const dist = (stats && stats.distribution) || [];
  if (!dist.length) { document.getElementById('distribution').innerHTML = ''; return; }
  const max = Math.max(...dist.map(x => +x.cnt || 0), 1);
  document.getElementById('distribution').innerHTML = '<div class="card-title" style="font-size:14px;">📊 评分分布</div>'
    + dist.map(x => '<div class="dist-bar"><div class="label">' + starsHtml(+x.score) + ' ' + (+x.score || 0) + '星</div><div class="bg-track"><div class="bg-fill" style="width:' + ((+x.cnt || 0) / max * 100) + '%"></div></div><div class="count">' + (+x.cnt || 0) + '</div></div>').join('');
}

function starsHtml(score) {
  let h = '';
  for (let i = 0; i < 5; i++) h += i < score ? '⭐' : '☆';
  return h;
}

function renderTable() {
  if (_sortBy) {
    _allRows.sort((a, b) => {
      const va = a[_sortBy], vb = b[_sortBy];
      const cmp = (typeof va === 'string' ? va.localeCompare(vb) : (va > vb ? 1 : va < vb ? -1 : 0));
      return _sortDir === 'asc' ? cmp : -cmp;
    });
    _allRows.forEach((r, i) => r.rank = i + 1);
  }
  const total = _allRows.length;
  const totalPages = Math.max(1, Math.ceil(total / _pageSize));
  if (_page > totalPages) _page = totalPages;
  const pageRows = _allRows.slice((_page - 1) * _pageSize, _page * _pageSize);
  document.getElementById('page-info').textContent = '共 ' + total + ' 条 · 第 ' + _page + '/' + totalPages + ' 页';

  const def = COL_DEFS[_activeTab];
  const visible = Object.keys(_visibleCols[_activeTab] || {}).filter(k => _visibleCols[_activeTab][k]);
  const colDefs = def.metrics.filter(m => visible.includes(m.key));

  if (!pageRows.length) {
    document.getElementById('table-box').innerHTML = '<div class="k-empty">该范围暂无评价</div>';
    return;
  }

  const thead = '<tr>' + colDefs.map(m => {
    let label = m.label;
    if (_sortBy === m.key) label += ' ' + (_sortDir === 'asc' ? '↑' : '↓');
    return '<th class="qf-sort-cursor" onclick="sortBy(\'' + m.key + '\')">' + label + '</th>';
  }).join('') + '</tr>';

  const tbody = pageRows.map(r => '<tr>' + colDefs.map(m => '<td>' + formatCell(m, r[m.key]) + '</td>').join('') + '</tr>').join('');
  document.getElementById('table-box').innerHTML = '<table class="qf-table">' + thead + tbody + '</table>';
}

function formatCell(col, val) {
  if (val === null || val === undefined || val === '') return '-';
  if (col.type === 'sec') return Math.round(+val) + 's';
  if (col.type === 'pct') return (+val).toFixed(1) + '%';
  if (col.type === 'rank') {
    const r = +val;
    let cls = '';
    if (r === 1) cls = 'rank-1';
    else if (r === 2) cls = 'rank-2';
    else if (r === 3) cls = 'rank-3';
    return '<span class="rank-bar ' + cls + '">' + r + '</span>';
  }
  if (col.type === 'time') return String(val).substring(0, 19);
  if (col.type === 'name') return '<strong>' + val + '</strong>';
  if (col.type === 'code') return '<code style="font-size:11px;">' + String(val).slice(0, 18) + '</code>';
  if (col.type === 'star') return '<span class="star-rating">' + starsHtml(+val) + '</span> <span class="k-text-muted">' + val + '分</span>';
  if (col.type === 'level') {
    const map = { satisfied: '<span class="tag-sat">😊 满意</span>', neutral: '<span class="tag-neu">😐 一般</span>', dissatisfied: '<span class="tag-dis">😞 不满意</span>' };
    return map[val] || val;
  }
  if (col.type === 'tags') {
    try {
      const arr = JSON.parse(val);
      if (Array.isArray(arr)) return arr.map(t => '<span class="k-tag" style="background:#EEF2FF;color:#1E1B4B;padding:2px 8px;border-radius:12px;font-size:11px;margin-right:4px;">' + JSON.stringify(t) + '</span>').join('');
    } catch (e) {}
    return val;
  }
  if (col.type === 'text') return '<div style="max-width:340px;line-height:1.5;">' + String(val).replace(/</g, '&lt;') + '</div>';
  return val;
}

function sortBy(key) {
  if (_sortBy === key) _sortDir = _sortDir === 'asc' ? 'desc' : 'asc';
  else { _sortBy = key; _sortDir = 'desc'; }
  renderTable();
}

function changePage(delta) {
  const totalPages = Math.max(1, Math.ceil(_allRows.length / _pageSize));
  _page = Math.max(1, Math.min(totalPages, _page + delta));
  renderTable();
}

function exportCsv() {
  if (!_allRows.length) { A.toast('请先查询数据', 'warning'); return; }
  const def = COL_DEFS[_activeTab];
  const visible = Object.keys(_visibleCols[_activeTab] || {}).filter(k => _visibleCols[_activeTab][k]);
  const colDefs = def.metrics.filter(m => visible.includes(m.key));
  const lines = ['\uFEFF' + colDefs.map(c => c.label).join(',')];
  _allRows.forEach(r => lines.push(colDefs.map(c => r[c.key] ?? '').join(',')));
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'evaluates-' + _activeTab + '-' + (document.getElementById('fromDate').value || '') + '.csv';
  a.click();
  A.toast('已导出 CSV', 'success');
}

// init
document.getElementById('fromDate').value = A.daysAgo ? A.daysAgo(6) : '';
document.getElementById('toDate').value = A.today ? A.today() : '';
_visibleCols[_activeTab] = getDefaultVisible(_activeTab);
loadCurrent();
</script>
</body>
</html>
