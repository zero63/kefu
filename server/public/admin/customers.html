<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>客户管理 · kefu 管理后台</title>
<link rel="stylesheet" href="/design-system.css" />
<style>
.vip-badge { display: inline-block; width: 22px; height: 22px; border-radius: 4px; background: linear-gradient(135deg, #F59E0B, #D97706); color: white; font-size: 11px; font-weight: 700; line-height: 22px; text-align: center; vertical-align: middle; }
.vip-0 { background: var(--color-muted); color: var(--color-text-3); }
.vip-1 { background: linear-gradient(135deg, #FCD34D, #F59E0B); }
.vip-2 { background: linear-gradient(135deg, #F59E0B, #D97706); }
.vip-3 { background: linear-gradient(135deg, #F97316, #C2410C); }
.vip-4 { background: linear-gradient(135deg, #DC2626, #991B1B); }
.vip-5 { background: linear-gradient(135deg, #7C3AED, #5B21B6); }
.cust-card { display: flex; align-items: center; padding: 14px 16px; background: white; border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--color-border); transition: all .15s; }
.cust-card:hover { border-color: var(--color-primary-light); box-shadow: var(--shadow-sm); }
.cust-card .av { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--color-primary), var(--color-accent)); color: white; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; margin-right: 12px; flex-shrink: 0; }
</style>
</head>
<body style="background:var(--color-bg);padding:24px;">

<div class="k-toolbar">
  <div style="font-size:18px;font-weight:600;">👤 客户管理</div>
</div>

<!-- 统计 -->
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:16px;">
  <div class="k-metric"><div class="label">总客户数</div><div class="value" id="m-total">-</div></div>
  <div class="k-metric"><div class="label"><span class="vip-badge vip-1">V1</span> 普通 VIP</div><div class="value" id="m-vip1">-</div></div>
  <div class="k-metric"><div class="label"><span class="vip-badge vip-2">V2</span> 银卡</div><div class="value" id="m-vip2">-</div></div>
  <div class="k-metric"><div class="label"><span class="vip-badge vip-3">V3</span> 金卡</div><div class="value" id="m-vip3">-</div></div>
  <div class="k-metric"><div class="label"><span class="vip-badge vip-4">V4</span> 白金</div><div class="value" id="m-vip4">-</div></div>
  <div class="k-metric"><div class="label"><span class="vip-badge vip-5">V5</span> 钻石</div><div class="value" id="m-vip5">-</div></div>
</div>

<div style="display:grid;grid-template-columns:3fr 1fr;gap:16px;">
  <div class="k-card">
    <div class="k-card-title">客户列表</div>
    <div class="k-form-row">
      <div class="item flex"><input id="kw" class="k-input" placeholder="搜索 ID / 昵称 / 手机 / 邮箱"></div>
      <div class="item compact"><select id="vip-filter" class="k-select">
        <option value="">全部 VIP</option>
        <option value="all">非 VIP</option>
        <option value="1">V1+</option>
        <option value="2">V2+</option>
        <option value="3">V3+</option>
        <option value="4">V4+</option>
        <option value="5">V5</option>
      </select></div>
      <button class="k-btn k-btn-primary k-btn-mini" onclick="loadList()">搜索</button>
    </div>
    <table class="k-table">
      <thead><tr>
        <th>客户</th><th>等级</th><th>手机</th><th>渠道</th>
        <th>消费</th><th>上次活跃</th><th>来源</th><th style="text-align:right;">操作</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="k-pager">
      <span class="info" id="pg-info">-</span>
      <button onclick="prev()">‹</button>
      <span class="info" id="pg-num">1</span>
      <button onclick="next()">›</button>
    </div>
  </div>

  <div class="k-card">
    <div class="k-card-title">客户分组
      <button class="k-btn-text" onclick="openGroup()">+ 新建</button>
    </div>
    <div id="group-list"></div>
    <div class="k-card-title" style="margin-top:24px;">VIP 等级说明</div>
    <div style="font-size:12px;color:var(--color-text-2);line-height:1.8;">
      <div><span class="vip-badge vip-0">V0</span> 普通客户（无消费）</div>
      <div><span class="vip-badge vip-1">V1</span> 累计消费 ≥ 100</div>
      <div><span class="vip-badge vip-2">V2</span> 累计消费 ≥ 500</div>
      <div><span class="vip-badge vip-3">V3</span> 累计消费 ≥ 2000</div>
      <div><span class="vip-badge vip-4">V4</span> 累计消费 ≥ 5000</div>
      <div><span class="vip-badge vip-5">V5</span> 累计消费 ≥ 10000</div>
    </div>
  </div>
</div>

<script src="/admin/common.js"></script>
<script src="/ui.js"></script>
<script>
if (!KefuAdmin.token) KefuAdmin.token = localStorage.getItem('kefu_token');
if (!UI.token) UI.token = localStorage.getItem('kefu_token');
let page = 1, size = 10;

async function loadStats() {
  const j = await UI.api('GET', '/api/admin/customer-mgmt/stats');
  if (j.code === 0) {
    document.getElementById('m-total').textContent = j.data.total;
    for (let i = 1; i <= 5; i++) {
      document.getElementById('m-vip' + i).textContent = j.data['vip' + i] || 0;
    }
  }
}

async function loadList() {
  const kw = document.getElementById('kw').value.trim();
  const vip = document.getElementById('vip-filter').value;
  let url = `/api/admin/customer-mgmt/list?page=${page}&size=${size}`;
  if (kw) url += '&keyword=' + encodeURIComponent(kw);
  if (vip) url += '&vip_level=' + vip;
  const j = await UI.api('GET', url);
  const list = (j.data && j.data.list) || [];
  const tbody = document.getElementById('tbody');
  document.getElementById('pg-info').textContent = '共 ' + (j.data?.total || 0) + ' 条';
  document.getElementById('pg-num').textContent = page;
  tbody.innerHTML = list.length ? list.map(c => {
    const vipCls = 'vip-badge vip-' + (c.vip_level || 0);
    return `<tr>
      <td>
        <div style="display:flex;align-items:center;">
          <div class="cust-card" style="border:none;padding:0;background:transparent;margin:0;width:auto;">
            <div class="av">${(c.nickname || c.external_id || '?').slice(0, 1)}</div>
          </div>
          <div>
            <div style="font-weight:600;">${UI.escapeHtml(c.nickname || '-')}</div>
            <div style="font-family:'JetBrains Mono';font-size:11px;color:var(--color-text-3);">${UI.escapeHtml(c.external_id || '')}</div>
          </div>
        </div>
      </td>
      <td><span class="${vipCls}">${c.vip_level > 0 ? 'V' + c.vip_level : '-'}</span></td>
      <td>${UI.escapeHtml(c.phone || '-')}</td>
      <td><span class="k-tag k-tag-blue">${UI.escapeHtml(c.channel || c.source || '-')}</span></td>
      <td><code>¥${(c.total_spent || 0).toLocaleString()}</code></td>
      <td class="text-muted">${UI.fmtDate(c.last_active_time)}</td>
      <td class="text-muted">${UI.escapeHtml(c.source || '-')}</td>
      <td style="text-align:right;">
        <button class="k-btn-text" onclick="openVip(${c.id},${c.vip_level})">设置 VIP</button>
        <button class="k-btn-text" onclick="viewDetail(${c.id})">详情</button>
      </td>
    </tr>`;
  }).join('') : '<tr><td colspan="8" class="k-empty">暂无客户</td></tr>';
}

async function loadGroups() {
  const j = await UI.api('GET', '/api/admin/customer-group/list');
  const list = (j.data && j.data.list) || [];
  document.getElementById('group-list').innerHTML = list.length ? list.map(g =>
    `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--color-muted);">
      <div>
        <div style="font-weight:500;">${UI.escapeHtml(g.name)}</div>
        <div class="text-muted" style="font-size:11px;">${g.customer_count || 0} 人</div>
      </div>
      <button class="k-btn-text" onclick="delG(${g.id})" style="color:var(--color-danger);">删除</button>
    </div>`
  ).join('') : '<div class="k-empty">暂无分组</div>';
}

function openVip(id, current) {
  UI.modal('设置 VIP 等级',
    `<div class="k-form-row">
      <div class="item"><label>当前等级</label>
        <input class="k-input" value="V${current}" disabled></div>
      <div class="item"><label>目标等级</label>
        <select id="m-lv" class="k-select">
          <option value="0">V0 - 普通</option>
          <option value="1">V1 - 普通 VIP</option>
          <option value="2">V2 - 银卡</option>
          <option value="3">V3 - 金卡</option>
          <option value="4">V4 - 白金</option>
          <option value="5">V5 - 钻石</option>
        </select>
      </div>
    </div>`,
    async ok => {
      if (!ok) return false;
      const lv = document.getElementById('m-lv').value;
      const j = await UI.api('POST', '/api/admin/customer-mgmt/set-vip', { id, vip_level: lv });
      if (j.code !== 0) { UI.error(j.msg); return false; }
      UI.success('已设置');
      loadList(); loadStats();
    }
  );
}

async function viewDetail(id) {
  const j = await UI.api('GET', '/api/admin/customer-mgmt/detail?id=' + id);
  if (j.code !== 0) return UI.error(j.msg);
  const c = j.data;
  const fields = c.custom_fields || [];
  UI.modal('客户详情',
    `<div style="display:flex;align-items:center;margin-bottom:16px;">
      <div class="cust-card" style="border:none;padding:0;background:transparent;margin:0;width:auto;">
        <div class="av xl">${(c.nickname || c.customer_id || '?').slice(0, 1)}</div>
      </div>
      <div style="margin-left:12px;">
        <div style="font-size:18px;font-weight:600;">${UI.escapeHtml(c.nickname || '-')}</div>
        <div style="color:var(--color-text-3);font-family:'JetBrains Mono';font-size:12px;">${UI.escapeHtml(c.customer_id || '')}</div>
      </div>
    </div>
    <table class="k-table" style="font-size:13px;">
      <tr><th>手机</th><td>${UI.escapeHtml(c.phone || '-')}</td><th>邮箱</th><td>${UI.escapeHtml(c.email || '-')}</td></tr>
      <tr><th>性别</th><td>${c.gender === 1 ? '男' : c.gender === 2 ? '女' : '-'}</td><th>VIP 等级</th><td>V${c.vip_level || 0}</td></tr>
      <tr><th>渠道</th><td>${UI.escapeHtml(c.channel || '-')}</td><th>状态</th><td>${UI.escapeHtml(c.status || '-')}</td></tr>
      <tr><th>累计消费</th><td>¥${(c.total_spent || 0).toLocaleString()}</td><th>标签</th><td>${UI.escapeHtml(c.tags || '-')}</td></tr>
      <tr><th>注册时间</th><td colspan="3">${UI.fmtDate(c.register_time)}</td></tr>
      <tr><th>最近活跃</th><td colspan="3">${UI.fmtDate(c.last_active_time)}</td></tr>
    </table>
    ${fields.length ? '<div class="k-card-title" style="margin-top:16px;">自定义字段</div><table class="k-table" style="font-size:13px;"><tbody>' +
      fields.map(f => `<tr><th>${UI.escapeHtml(f.field_name)}</th><td>${UI.escapeHtml(f.field_value || '-')}</td></tr>`).join('') +
      '</tbody></table>' : ''}`,
    () => false
  );
}

function openGroup() {
  UI.modal('新建客户分组',
    `<div class="k-form-row"><div class="item flex"><label>分组名</label><input id="g-n" class="k-input"></div></div>
     <div class="k-form-row"><div class="item flex"><label>描述</label><input id="g-d" class="k-input"></div></div>`,
    async ok => {
      if (!ok) return false;
      const j = await UI.api('POST', '/api/admin/customer-group/create', {
        name: document.getElementById('g-n').value,
        description: document.getElementById('g-d').value,
      });
      if (j.code !== 0) { UI.error(j.msg); return false; }
      UI.success('已创建');
      loadGroups();
    }
  );
}

async function delG(id) {
  if (!UI.confirm('确认删除分组？')) return;
  await UI.api('POST', '/api/admin/customer-group/delete', { id });
  UI.success('已删除');
  loadGroups();
}

function prev() { if (page > 1) { page--; loadList(); } }
function next() { page++; loadList(); }

loadStats();
loadList();
loadGroups();
</script>
</body>
</html>
