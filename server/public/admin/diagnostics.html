<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>故障诊断 · kefu 管理后台</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/design-system.css" />
<link rel="stylesheet" href="/admin/admin2.css" />
<style>
  .dx-layout{display:grid;grid-template-columns:1fr 380px;gap:16px}
  @media (max-width:1100px){.dx-layout{grid-template-columns:1fr}}
  .dx-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--color-card);border:1px solid var(--color-border);border-radius:8px;margin-bottom:8px;transition:all .2s}
  .dx-item:hover{box-shadow:0 2px 8px rgba(14,165,233,.06)}
  .dx-icon{width:36px;height:36px;border-radius:8px;background:var(--color-primary-bg);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .dx-item.ok{border-left:3px solid #10B981}
  .dx-item.fail{border-left:3px solid #EF4444}
  .dx-item.running{border-left:3px solid #F59E0B}
  .dx-content{flex:1;min-width:0}
  .dx-content .name{font-size:13px;font-weight:600;color:var(--color-text)}
  .dx-content .desc{font-size:11px;color:var(--color-text-3);margin-top:2px}
  .dx-status{font-size:12px;display:flex;align-items:center;gap:6px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .dot.ok{background:#10B981}
  .dot.fail{background:#EF4444}
  .dot.running{background:#F59E0B;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .latency{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--color-text-3);background:var(--color-primary-bg);padding:2px 6px;border-radius:4px}
  .overall{padding:18px;border-radius:10px;margin-bottom:16px;display:flex;align-items:center;gap:14px;border:1px solid}
  .overall.ok{background:#F0FDF4;border-color:#10B981;color:#065F46}
  .overall.fail{background:#FEF2F2;border-color:#EF4444;color:#991B1B}
  .overall .v{font-size:36px;font-weight:700}
  .detail-box{background:var(--color-card);border:1px solid var(--color-border);border-radius:8px;padding:18px;margin-top:16px}
  .detail-box pre{background:#1E293B;color:#94A3B8;padding:14px;border-radius:6px;font-size:11px;line-height:1.6;overflow:auto;max-height:300px;font-family:'Fira Code',monospace}
  .suggest-list{padding:0;margin:0;list-style:none}
  .suggest-list li{padding:10px 14px;background:var(--color-card);border:1px solid var(--color-border);border-radius:6px;margin-bottom:6px;font-size:12px;color:var(--color-text-2);display:flex;gap:8px;align-items:flex-start}
  .suggest-list li::before{content:'💡';flex-shrink:0}
  .history-table{font-size:12px}
  .history-table .ok{color:#10B981}
  .history-table .fail{color:#EF4444}
</style>
</head>
<body style="margin:0;padding:0;">

<div class="card">
  <div class="card-title">
    <span style="display:inline-flex;align-items:center;gap:8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-primary)"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      故障诊断
    </span>
    <div class="extra">
      <button class="k-btn k-btn-mini" onclick="loadHistory()">🔄 刷新历史</button>
      <button class="k-btn k-btn-primary" onclick="runAll()" id="btn-run-all">▶ 一键巡检</button>
    </div>
  </div>

  <div id="overall-box" class="overall" style="display:none">
    <div class="v" id="overall-icon">✓</div>
    <div>
      <div style="font-size:16px;font-weight:600" id="overall-title">系统状态</div>
      <div style="font-size:12px;opacity:.7;margin-top:4px" id="overall-sub"></div>
    </div>
  </div>

  <div class="dx-layout">
    <div id="items-list"></div>
    <div>
      <div class="card-title" style="font-size:14px;padding:0;margin-bottom:12px">
        <span style="font-weight:600">📋 巡检项详情</span>
      </div>
      <div id="detail-box" class="detail-box" style="margin:0">
        <div class="k-empty" style="padding:40px 0;text-align:center">点击左侧项目查看详情，或点击「一键巡检」自动扫描</div>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-title">📜 历史巡检记录</div>
  <div id="history-list" class="k-loading">加载中...</div>
  <div id="history-pager"></div>
</div>

<script src="/admin/common.js?v=2026"></script>
<script>
if (!KefuAdmin.token) {
  if (parent && parent.KefuAdmin && parent.KefuAdmin.token) KefuAdmin.token = parent.KefuAdmin.token;
  else if (parent && parent.UI && parent.UI.token) KefuAdmin.token = parent.UI.token;
  else KefuAdmin.token = localStorage.getItem('kefu_token');
}
if (!KefuAdmin.token) { top.location.href = '/admin/login.html'; throw new Error('not logged in'); }
const A = KefuAdmin;

let items = [];
let historyPage = 1;

async function loadItems() {
  const r = await A.api('GET', '/api/admin/diagnostics/items');
  if (r.code !== 0) return;
  items = r.data.items || [];
  renderItems();
}

function renderItems() {
  const box = document.getElementById('items-list');
  box.innerHTML = items.map(it => `
    <div class="dx-item" data-type="${it.key}" onclick="checkOne('${it.key}')">
      <div class="dx-icon">${it.icon}</div>
      <div class="dx-content">
        <div class="name">${it.name}</div>
        <div class="desc">${it.desc}</div>
      </div>
      <div class="dx-status">
        <span class="dot" id="dot-${it.key}"></span>
        <span class="latency" id="lat-${it.key}">—</span>
      </div>
    </div>
  `).join('');
}

async function checkOne(type) {
  const it = items.find(i => i.key === type);
  document.getElementById(`dot-${type}`).className = 'dot running';
  const detail = document.getElementById('detail-box');
  detail.innerHTML = `<div style="padding:14px;color:var(--color-text-3);font-size:12px">⏳ 正在检查 <b>${it.name}</b> ...</div>`;
  const r = await A.api('GET', '/api/admin/diagnostics/check?type=' + type);
  document.getElementById(`dot-${type}`).className = 'dot ' + (r.code === 0 ? 'ok' : 'fail');
  document.getElementById(`lat-${type}`).textContent = (r.data && r.data.latency_ms) + 'ms';
  renderDetail(type, r);
  loadHistory();
}

function renderDetail(type, r) {
  const it = items.find(i => i.key === type);
  const data = r.data || {};
  let html = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div>
        <div style="font-size:15px;font-weight:600">${it.icon} ${it.name}</div>
        <div style="font-size:12px;color:var(--color-text-3);margin-top:4px">${escapeHtml(r.msg || '')}</div>
      </div>
      <span class="latency">${data.latency_ms||0}ms</span>
    </div>
    <pre>${escapeHtml(JSON.stringify(data, null, 2))}</pre>
  `;
  if (r.code !== 0 || (data.message && data.message.includes('失败'))) {
    html += `<div style="margin-top:14px"><div style="font-size:12px;font-weight:600;margin-bottom:8px">🔧 修复建议</div><ul id="suggest-${type}" class="suggest-list"></ul></div>`;
    loadSuggest(type);
  }
  document.getElementById('detail-box').innerHTML = html;
}

async function loadSuggest(type) {
  const r = await A.api('GET', '/api/admin/diagnostics/suggest?type=' + type);
  const box = document.getElementById('suggest-' + type);
  if (!box) return;
  const s = (r.data && r.data.suggestions) || [];
  if (!s.length) { box.innerHTML = '<li style="background:#F9FAFB;color:var(--color-text-3)">暂无建议</li>'; return; }
  box.innerHTML = s.map(x => `<li>${escapeHtml(x)}</li>`).join('');
}

async function runAll() {
  const btn = document.getElementById('btn-run-all');
  btn.disabled = true; btn.textContent = '⏳ 巡检中...';
  items.forEach(it => {
    document.getElementById(`dot-${it.key}`).className = 'dot running';
    document.getElementById(`lat-${it.key}`).textContent = '—';
  });
  const r = await A.api('GET', '/api/admin/diagnostics/run-all');
  btn.disabled = false; btn.textContent = '▶ 一键巡检';

  const results = (r.data && r.data.results) || [];
  let okCount = 0;
  results.forEach(x => {
    document.getElementById(`dot-${x.type}`).className = 'dot ' + (x.ok ? 'ok' : 'fail');
    document.getElementById(`lat-${x.type}`).textContent = x.latency_ms + 'ms';
    if (x.ok) okCount++;
  });

  const overall = document.getElementById('overall-box');
  overall.style.display = 'flex';
  overall.className = 'overall ' + (r.data.overall_ok ? 'ok' : 'fail');
  document.getElementById('overall-icon').textContent = r.data.overall_ok ? '✓' : '⚠';
  document.getElementById('overall-title').textContent = r.data.overall_ok ? '系统全部正常' : `发现 ${results.length - okCount} 项异常`;
  document.getElementById('overall-sub').textContent = `通过 ${okCount} / 总 ${results.length} · 用时 ${results.reduce((a,b)=>a+(b.latency_ms||0),0)}ms`;

  // 把第一个失败项填入详情
  const failed = results.find(x => !x.ok);
  if (failed) renderDetail(failed.type, { code: 400, msg: failed.message, data: failed.detail });
  else renderDetail(results[0] ? results[0].type : 'db', { code: 0, msg: '巡检通过', data: results[0] ? results[0].detail : {} });

  loadHistory();
}

async function loadHistory() {
  const r = await A.api('GET', '/api/admin/diagnostics/logs?page=' + historyPage);
  const box = document.getElementById('history-list');
  box.classList.remove('k-loading');
  if (r.code !== 0) { box.innerHTML = '<div class="k-empty">加载失败</div>'; return; }
  const rows = (r.data && r.data.list) || [];
  if (!rows.length) { box.innerHTML = '<div class="k-empty">暂无巡检记录</div>'; return; }
  box.innerHTML = `<table class="k-table history-table">
    <thead><tr><th>时间</th><th>类型</th><th>目标</th><th>状态</th><th>延迟</th><th>消息</th></tr></thead>
    <tbody>${rows.map(r => `
      <tr>
        <td>${r.created_at}</td>
        <td><span class="badge" style="background:#DBEAFE;color:#1E40AF;padding:2px 8px;border-radius:4px">${r.check_type}</span></td>
        <td><code style="font-size:11px">${escapeHtml(r.target || '-')}</code></td>
        <td><span class="${r.status==1?'ok':'fail'}">${r.status==1?'✓ 正常':'✗ 异常'}</span></td>
        <td>${r.latency_ms}ms</td>
        <td>${escapeHtml(r.message || '')}</td>
      </tr>
    `).join('')}</tbody></table>`;
  const pager = document.getElementById('history-pager');
  pager.innerHTML = '';
  if (A.renderPagination) pager.appendChild(A.renderPagination(r.data.total, historyPage, r.data.size, p => { historyPage = p; loadHistory(); }));
}

function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

loadItems();
loadHistory();
</script>
</body>
</html>
