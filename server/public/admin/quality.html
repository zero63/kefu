<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>质检报告 · kefu 管理后台</title>
<link rel="stylesheet" href="/design-system.css" />
<link rel="stylesheet" href="/admin/admin2.css" />
<style>
.quality-tabs { display: flex; gap: 0; border-bottom: 2px solid var(--color-muted); margin-bottom: 16px; }
.quality-tabs .tab { padding: 10px 20px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--color-text-2); border-bottom: 2px solid transparent; margin-bottom: -2px; }
.quality-tabs .tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
.quality-tabs .tab:hover { color: var(--color-primary); }
.tab-pane { display: none; }
.tab-pane.active { display: block; }
.stat-card { display: inline-block; padding: 14px 22px; background: linear-gradient(135deg, #F5F3FF, #EDE9FE); border-radius: var(--r-md); margin-right: 12px; margin-bottom: 12px; min-width: 160px; }
.stat-card .label { font-size: 12px; color: var(--color-text-2); margin-bottom: 4px; }
.stat-card .value { font-size: 24px; font-weight: 700; color: var(--color-primary); }
.score-bar { height: 6px; background: var(--color-muted); border-radius: 3px; overflow: hidden; }
.score-bar > .fill { height: 100%; background: linear-gradient(90deg, #10B981, #34D399); }
.score-bar > .fill.warn { background: linear-gradient(90deg, #F59E0B, #FBBF24); }
.score-bar > .fill.danger { background: linear-gradient(90deg, #EF4444, #F87171); }
</style>
</head>
<body style="margin:0;padding:0;">

<div class="card">
  <div class="card-title">📋 质检报告
    <span class="extra">
      <button class="k-btn k-btn-primary k-btn-mini" onclick="switchTab('inspect')">🔍 一键抽检</button>
      <button class="k-btn k-btn-secondary k-btn-mini" onclick="switchTab('rules')">⚙ 规则管理</button>
    </span>
  </div>

  <div class="quality-tabs">
    <div class="tab active" data-tab="results" onclick="switchTab('results')">📊 报告列表</div>
    <div class="tab" data-tab="inspect" onclick="switchTab('inspect')">🔍 一键抽检</div>
    <div class="tab" data-tab="stats" onclick="switchTab('stats')">📈 质检统计</div>
    <div class="tab" data-tab="rules" onclick="switchTab('rules')">⚙ 规则管理</div>
  </div>

  <!-- 报告列表 -->
  <div class="tab-pane active" id="pane-results">
    <div class="form-row">
      <input id="res-agent" class="k-input" placeholder="客服 ID（可选）" style="width:160px;" />
      <select id="res-status" class="k-select" style="width:140px;">
        <option value="">全部状态</option>
        <option value="pending">待复审</option>
        <option value="passed">已通过</option>
        <option value="failed">未通过</option>
      </select>
      <button class="k-btn k-btn-primary" onclick="loadResults()">查询</button>
    </div>
    <div id="result-list"></div>
  </div>

  <!-- 一键抽检 -->
  <div class="tab-pane" id="pane-inspect">
    <div class="form-row">
      <label>会话 ID（session_id，如 s_01xxx...）</label>
      <div style="display:flex;gap:8px;">
        <input id="inspect-sid" class="k-input" placeholder="输入会话 ID" style="flex:1;" />
        <button class="k-btn k-btn-primary" onclick="inspectSession()">🔍 抽检</button>
      </div>
      <p class="k-text-muted" style="font-size:12px;margin-top:6px;">
        系统会按规则自动计算评分（首响时长、消息条数、关闭原因、敏感词、客户评分等），可对单会话进行抽检。
      </p>
    </div>
    <div id="inspect-result"></div>
  </div>

  <!-- 统计 -->
  <div class="tab-pane" id="pane-stats">
    <div class="form-row">
      <input id="stat-start" type="date" class="k-input" style="width:140px;" />
      <span class="k-text-muted">~</span>
      <input id="stat-end" type="date" class="k-input" style="width:140px;" />
      <button class="k-btn k-btn-primary" onclick="loadStats()">查询</button>
    </div>
    <div id="stats-box"></div>
  </div>

  <!-- 规则管理 -->
  <div class="tab-pane" id="pane-rules">
    <div class="form-row">
      <button class="k-btn k-btn-primary k-btn-mini" onclick="openRuleModal()">+ 新增规则</button>
    </div>
    <div id="rule-list"></div>
  </div>
</div>

<script src="/admin/common.js?v=2026"></script>
<script>
if (!KefuAdmin.token) {
  if (parent && parent.KefuAdmin && parent.KefuAdmin.token) KefuAdmin.token = parent.KefuAdmin.token;
  else if (parent && parent.UI && parent.UI.token) KefuAdmin.token = parent.UI.token;
  else KefuAdmin.token = localStorage.getItem('kefu_token');
}
if (!KefuAdmin.token) { top.location.href = '/admin/login.html'; throw new Error('not logged in'); }
const A = KefuAdmin;

function switchTab(name) {
  document.querySelectorAll('.quality-tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + name));
  if (name === 'results') loadResults();
  else if (name === 'inspect') {/* noop */}
  else if (name === 'stats') loadStats();
  else if (name === 'rules') loadRules();
}

// 默认日期
document.getElementById('stat-start').value = A.daysAgo ? A.daysAgo(29) : '';
document.getElementById('stat-end').value = A.today ? A.today() : '';

// ===== 报告列表 =====
async function loadResults() {
  const agent = document.getElementById('res-agent').value;
  const status = document.getElementById('res-status').value;
  const params = new URLSearchParams({ page: 1, size: 30 });
  if (agent) params.set('agent_id', agent);
  if (status) params.set('review_status', status);
  const r = await A.api('GET', '/api/admin/quality/result/list?' + params);
  const box = document.getElementById('result-list');
  if (r.code !== 0) { box.innerHTML = '<div class="k-empty">加载失败</div>'; return; }
  const list = (r.data && r.data.list) || [];
  if (!list.length) { box.innerHTML = '<div class="k-empty">暂无质检报告，请先在"一键抽检"中发起</div>'; return; }
  box.innerHTML = '<table class="k-table"><thead><tr><th>会话 ID</th><th>客服</th><th>评分</th><th>扣分明细</th><th>状态</th><th>抽检时间</th></tr></thead><tbody>'
    + list.map(x => {
      const sc = +x.score || 0;
      const scClass = sc >= 90 ? '' : sc >= 70 ? 'warn' : 'danger';
      return '<tr>' +
        '<td><code style="font-size:11px">' + (x.session_id || '-') + '</code></td>' +
        '<td>' + (x.agent_name || ('#' + x.agent_id)) + '</td>' +
        '<td><b>' + sc + '</b><div class="score-bar" style="margin-top:4px;width:80px;"><div class="fill ' + scClass + '" style="width:' + sc + '%"></div></div></td>' +
        '<td style="font-size:12px;max-width:300px;">' + (x.deduct_reason || '-') + '</td>' +
        '<td>' + statusTag(x.review_status) + '</td>' +
        '<td>' + (A.fmtDate ? A.fmtDate(x.inspect_at || x.created_at) : (x.inspect_at || x.created_at)) + '</td>' +
        '</tr>';
    }).join('') + '</tbody></table>';
}

function statusTag(s) {
  const map = { pending: '<span class="k-tag" style="background:#FEF3C7;color:#92400E">⏳ 待复审</span>',
    passed: '<span class="k-tag" style="background:#D1FAE5;color:#065F46">✓ 通过</span>',
    failed: '<span class="k-tag" style="background:#FEE2E2;color:#991B1B">✗ 未通过</span>' };
  return map[s] || s;
}

// ===== 一键抽检 =====
async function inspectSession() {
  const sid = document.getElementById('inspect-sid').value.trim();
  if (!sid) { A.toast('请输入会话 ID', 'error'); return; }
  const box = document.getElementById('inspect-result');
  box.innerHTML = '<div class="k-loading">抽检中...</div>';
  const r = await A.api('POST', '/api/admin/quality/inspect', { session_id: sid });
  if (r.code !== 0) { box.innerHTML = '<div class="k-empty">' + (r.msg || '抽检失败') + '</div>'; return; }
  const d = r.data || {};
  const sc = +d.score || 0;
  const scClass = sc >= 90 ? '' : sc >= 70 ? 'warn' : 'danger';
  box.innerHTML = '<div class="card-title" style="margin-top:8px;">抽检结果</div>' +
    '<div style="padding:14px 18px;background:#F5F3FF;border-radius:var(--r-md);">' +
    '<div style="display:flex;align-items:center;gap:16px;margin-bottom:12px;">' +
      '<div style="font-size:36px;font-weight:700;color:var(--color-primary);">' + sc + '</div>' +
      '<div style="flex:1;"><div class="score-bar" style="height:10px;"><div class="fill ' + scClass + '" style="width:' + sc + '%"></div></div>' +
      '<div style="font-size:12px;color:var(--color-text-2);margin-top:6px;">总分 100 · ' + (sc >= 90 ? '优秀' : sc >= 70 ? '合格' : '需改进') + '</div></div>' +
    '</div>' +
    '<div style="font-size:13px;line-height:1.7;">' +
      '<div>📋 会话：<code>' + (d.session_id || sid) + '</code></div>' +
      '<div>👤 客服：' + (d.agent_name || ('#' + d.agent_id)) + '</div>' +
      '<div>📊 消息数：' + (d.message_count || 0) + ' · 首响：' + (d.first_response_sec || 0) + 's · 时长：' + Math.round((d.duration || 0)/60) + 'min</div>' +
      '<div>📝 扣分明细：<br>' + (d.deduct_reason || '无扣分项') + '</div>' +
      '<div>✅ 结果：' + statusTag(d.review_status) + '</div>' +
    '</div>' +
    '</div>';
  loadResults();
}

// ===== 统计 =====
async function loadStats() {
  const start = document.getElementById('stat-start').value;
  const end = document.getElementById('stat-end').value;
  const r = await A.api('GET', '/api/admin/quality/stats?start_date=' + start + '&end_date=' + end);
  const box = document.getElementById('stats-box');
  if (r.code !== 0) { box.innerHTML = '<div class="k-empty">加载失败</div>'; return; }
  const d = r.data || {};
  box.innerHTML =
    '<div style="margin:8px 0 16px;">' +
    '<div class="stat-card"><div class="label">已抽检数</div><div class="value">' + (d.total || 0) + '</div></div>' +
    '<div class="stat-card"><div class="label">通过数</div><div class="value" style="color:#10B981;">' + (d.passed || 0) + '</div></div>' +
    '<div class="stat-card"><div class="label">未通过数</div><div class="value" style="color:#EF4444;">' + (d.failed || 0) + '</div></div>' +
    '<div class="stat-card"><div class="label">待复审数</div><div class="value" style="color:#F59E0B;">' + (d.pending || 0) + '</div></div>' +
    '<div class="stat-card"><div class="label">平均评分</div><div class="value" style="color:#7C3AED;">' + Math.round(d.avg_score || 0) + '</div></div>' +
    '<div class="stat-card"><div class="label">通过率</div><div class="value">' + ((d.pass_rate || 0)) + '%</div></div>' +
    '</div>' +
    (d.by_agent && d.by_agent.length ?
      '<div class="card-title">客服质检排行</div>' +
      '<table class="k-table"><thead><tr><th>客服</th><th>抽检数</th><th>通过数</th><th>平均分</th><th>通过率</th></tr></thead><tbody>' +
      d.by_agent.map(x => '<tr>' +
        '<td><strong>' + (x.agent_name || ('#' + x.agent_id)) + '</strong></td>' +
        '<td>' + (x.total || 0) + '</td>' +
        '<td>' + (x.passed || 0) + '</td>' +
        '<td>' + Math.round(x.avg_score || 0) + '</td>' +
        '<td>' + ((x.total ? Math.round(x.passed / x.total * 100) : 0)) + '%</td>' +
      '</tr>').join('') + '</tbody></table>' : '');
}

// ===== 规则 =====
async function loadRules() {
  const r = await A.api('GET', '/api/admin/quality/rule/list');
  const box = document.getElementById('rule-list');
  if (r.code !== 0) { box.innerHTML = '<div class="k-empty">加载失败</div>'; return; }
  const list = (r.data && r.data.list) || [];
  if (!list.length) { box.innerHTML = '<div class="k-empty">暂无规则</div>'; return; }
  box.innerHTML = '<table class="k-table"><thead><tr><th>规则名</th><th>类型</th><th>扣分</th><th>等级</th><th>状态</th><th>操作</th></tr></thead><tbody>'
    + list.map(x => '<tr>' +
        '<td><strong>' + (x.rule_name || '-') + '</strong></td>' +
        '<td><code>' + (x.rule_type || '-') + '</code></td>' +
        '<td>' + (x.score || 0) + '</td>' +
        '<td>' + (x.level || '-') + '</td>' +
        '<td>' + ((+x.status === 1) ? '<span style="color:#10B981;">启用</span>' : '<span style="color:#6B7280;">停用</span>') + '</td>' +
        '<td><button class="k-btn k-btn-mini k-btn-primary" onclick="editRule(' + x.id + ')">编辑</button> <button class="k-btn k-btn-mini" onclick="toggleRule(' + x.id + ',' + (+x.status === 1 ? 0 : 1) + ')">' + ((+x.status === 1) ? '停用' : '启用') + '</button></td>' +
      '</tr>').join('') + '</tbody></table>';
}

let _ruleCache = null;
async function openRuleModal(id) {
  if (!_ruleCache && !id) {
    const r = await A.api('GET', '/api/admin/quality/rule/list');
    _ruleCache = (r.data && r.data.list) || [];
  }
  let rule = null;
  if (id) rule = _ruleCache.find(x => x.id === id) || null;
  const types = ['first_response', 'no_response', 'low_message_count', 'negative_word', 'no_closing', 'low_satisfaction'];
  const html = '<div class="form-row"><label>规则名</label><input id="r-name" class="k-input" value="' + (rule ? rule.rule_name : '') + '" /></div>' +
    '<div class="form-row"><label>类型</label><select id="r-type" class="k-select">' +
      types.map(t => '<option value="' + t + '"' + (rule && rule.rule_type === t ? ' selected' : '') + '>' + t + '</option>').join('') +
    '</select></div>' +
    '<div class="form-row"><label>扣分</label><input id="r-score" type="number" class="k-input" value="' + (rule ? rule.score : 5) + '" /></div>' +
    '<div class="form-row"><label>等级</label><select id="r-level" class="k-select">' +
      ['low', 'medium', 'high'].map(l => '<option value="' + l + '"' + (rule && rule.level === l ? ' selected' : '') + '>' + l + '</option>').join('') +
    '</select></div>';
  showModal('⚙ ' + (id ? '编辑' : '新增') + '质检规则', html, [
    { text: '取消', cls: 'k-btn-secondary', onClick: closeModal },
    { text: '保存', cls: 'k-btn-primary', onClick: () => saveRule(id) },
  ]);
}
async function saveRule(id) {
  const payload = {
    rule_name: document.getElementById('r-name').value.trim(),
    rule_type: document.getElementById('r-type').value,
    score: +document.getElementById('r-score').value || 5,
    level: document.getElementById('r-level').value,
    rule_config: {},
    status: 1,
  };
  if (!payload.rule_name) { A.toast('请填写规则名', 'error'); return; }
  const url = id ? '/api/admin/quality/rule/update' : '/api/admin/quality/rule/add';
  if (id) payload.id = id;
  const r = await A.api('POST', url, payload);
  if (r.code !== 0) { A.toast(r.msg || '保存失败', 'error'); return; }
  A.toast('已保存', 'success');
  closeModal();
  _ruleCache = null;
  loadRules();
}
async function editRule(id) { openRuleModal(id); }
async function toggleRule(id, status) {
  const r = await A.api('POST', '/api/admin/quality/rule/update', { id, status });
  if (r.code === 0) { A.toast('已更新', 'success'); _ruleCache = null; loadRules(); }
}

// ===== 通用弹窗 =====
let _modal = null;
function showModal(title, html, buttons) {
  closeModal();
  _modal = document.createElement('div');
  _modal.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.45);z-index:9000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);';
  _modal.innerHTML = '<div style="background:var(--color-card);border-radius:var(--r-md);box-shadow:0 24px 60px rgba(0,0,0,0.25);width:520px;max-width:92vw;max-height:88vh;display:flex;flex-direction:column;">' +
    '<div style="padding:16px 20px;border-bottom:1px solid var(--color-muted);font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center;">' +
      title + '<button onclick="closeModal()" style="background:transparent;border:0;font-size:22px;color:var(--color-text-3);cursor:pointer;line-height:1;">×</button>' +
    '</div>' +
    '<div style="padding:20px;overflow-y:auto;">' + html + '</div>' +
    '<div style="padding:12px 20px;border-top:1px solid var(--color-muted);display:flex;justify-content:flex-end;gap:8px;" id="modal-footer"></div>' +
    '</div>';
  document.body.appendChild(_modal);
  const footer = _modal.querySelector('#modal-footer');
  (buttons || []).forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'k-btn ' + (b.cls || 'k-btn-primary');
    btn.textContent = b.text;
    btn.onclick = b.onClick;
    footer.appendChild(btn);
  });
}
function closeModal() { if (_modal && _modal.parentNode) _modal.parentNode.removeChild(_modal); _modal = null; }

// init
const urlParams = new URLSearchParams(location.search);
if (urlParams.get('act') === 'inspect') switchTab('inspect');
else loadResults();
</script>
</body>
</html>
