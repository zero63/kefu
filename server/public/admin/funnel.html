<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>漏斗分析 · kefu 管理后台</title>
<link rel="stylesheet" href="/design-system.css" />
<style>
.funnel-step { display: flex; align-items: center; margin: 16px 0; }
.funnel-bar { height: 48px; background: linear-gradient(90deg, var(--color-primary), var(--color-primary-light)); border-radius: 12px; display: flex; align-items: center; padding: 0 18px; color: white; font-weight: 600; min-width: 100px; transition: width .5s; }
.funnel-meta { margin-left: 16px; color: var(--color-text-3); font-size: 13px; }
.funnel-meta b { color: var(--color-text); font-size: 16px; }
.funnel-rate { color: var(--color-success); font-size: 13px; margin-left: 8px; }
.funnel-rate.down { color: var(--color-danger); }
</style>
</head>
<body style="background:var(--color-bg);padding:24px;">

<div class="k-toolbar">
  <div style="font-size:18px;font-weight:600;">📉 漏斗 & 来源分析</div>
  <div class="spacer"></div>
  <button class="k-btn k-btn-primary" onclick="openFunnel()">+ 新建漏斗</button>
</div>

<div style="display:grid;grid-template-columns:2fr 1fr;gap:16px;">
  <div class="k-card">
    <div class="k-card-title">漏斗列表</div>
    <table class="k-table">
      <thead><tr><th>名称</th><th>步骤数</th><th>总转化</th><th style="text-align:right;">操作</th></tr></thead>
      <tbody id="f-tbody"></tbody>
    </table>
  </div>

  <div class="k-card">
    <div class="k-card-title">会话来源分布 <span class="extra">近 30 天</span></div>
    <div id="source-stats"></div>
  </div>
</div>

<div class="k-card" style="margin-top:16px;">
  <div class="k-card-title">漏斗可视化</div>
  <div id="funnel-viz">
    <div class="k-empty">请在列表中点击"分析"查看漏斗</div>
  </div>
</div>

<script src="/admin/common.js"></script>
<script src="/ui.js"></script>
<script>
if (!KefuAdmin.token) KefuAdmin.token = localStorage.getItem('kefu_token');
if (!UI.token) UI.token = localStorage.getItem('kefu_token');

const SOURCE_LABEL = {
  organic:  { name: '自然搜索', color: '#10B981', ico: '🔍' },
  ad:       { name: '付费广告', color: '#F59E0B', ico: '📢' },
  direct:   { name: '直接访问', color: '#0EA5E9', ico: '🌐' },
  referral: { name: '外链推荐', color: '#8B5CF6', ico: '🔗' },
  social:   { name: '社交媒体', color: '#EF4444', ico: '💬' },
};

async function loadFunnels() {
  const j = await UI.api('GET', '/api/admin/funnel/list');
  const list = (j.data && j.data.list) || [];
  const tbody = document.getElementById('f-tbody');
  tbody.innerHTML = list.length ? list.map(f => {
    const steps = f.steps || [];
    return `<tr>
      <td><b>${UI.escapeHtml(f.name)}</b></td>
      <td>${steps.length} 步</td>
      <td class="text-muted">-</td>
      <td style="text-align:right;">
        <button class="k-btn-text" onclick="analyze(${f.id})">分析</button>
        <button class="k-btn-text" onclick="removeF(${f.id})" style="color:var(--color-danger);">删除</button>
      </td>
    </tr>`;
  }).join('') : '<tr><td colspan="4" class="k-empty">暂无漏斗</td></tr>';
}

async function loadSourceStats() {
  const j = await UI.api('GET', '/api/admin/funnel/source-stats');
  const sources = (j.data && j.data.sources) || [];
  const total = sources.reduce((s, x) => s + parseInt(x.session_count || 0), 0);
  const box = document.getElementById('source-stats');
  if (!sources.length) { box.innerHTML = '<div class="k-empty">暂无来源数据</div>'; return; }
  box.innerHTML = sources.map(s => {
    const meta = SOURCE_LABEL[s.source] || { name: s.source, color: '#94A3B8', ico: '•' };
    const pct = total > 0 ? Math.round(s.session_count / total * 100) : 0;
    return `<div style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
        <span>${meta.ico} ${meta.name}</span>
        <span><b>${s.session_count}</b> 会话 · ${pct}%</span>
      </div>
      <div style="height:8px;background:var(--color-muted);border-radius:4px;overflow:hidden;">
        <div style="width:${pct}%;height:100%;background:${meta.color};border-radius:4px;"></div>
      </div>
    </div>`;
  }).join('');
}

async function analyze(id) {
  const j = await UI.api('GET', '/api/admin/funnel/analyze?id=' + id);
  if (j.code !== 0) return UI.error(j.msg);
  const d = j.data;
  const max = Math.max(...d.steps.map(s => s.count), 1);
  document.getElementById('funnel-viz').innerHTML =
    `<div style="font-size:18px;font-weight:600;margin-bottom:16px;">${UI.escapeHtml('漏斗 #' + id)} · 总转化 <b style="color:var(--color-primary);">${d.overall_conversion}%</b></div>` +
    d.steps.map((s, i) => {
      const width = Math.round(s.count / max * 100);
      return `<div class="funnel-step">
        <div class="funnel-bar" style="width:${width}%;">${s.name}</div>
        <div class="funnel-meta">
          <b>${s.count}</b> 人
          <span class="funnel-rate">${i === 0 ? '' : '↓ ' + s.conversion + '% 转化'}</span>
          <span class="text-muted"> · 总体 ${s.overall}%</span>
        </div>
      </div>`;
    }).join('');
}

function openFunnel() {
  UI.modal('新建漏斗',
    `<div class="k-form-row">
      <div class="item flex"><label>漏斗名称</label><input id="f-n" class="k-input" placeholder="新用户转化"></div>
    </div>
    <div class="k-form-label">步骤（JSON 数组，每步包含 name）</div>
    <textarea id="f-s" class="k-textarea" rows="6" placeholder='[
  {"name": "访问首页"},
  {"name": "注册账号"},
  {"name": "首次咨询"}
]'></textarea>`,
    async ok => {
      if (!ok) return false;
      let steps = [];
      try { steps = JSON.parse(document.getElementById('f-s').value || '[]'); }
      catch (e) { UI.error('JSON 格式错误'); return false; }
      const j = await UI.api('POST', '/api/admin/funnel/create', {
        name: document.getElementById('f-n').value, steps
      });
      if (j.code !== 0) { UI.error(j.msg); return false; }
      UI.success('已创建');
      loadFunnels();
    }
  );
}

async function removeF(id) {
  if (!UI.confirm('确认删除？')) return;
  const j = await UI.api('POST', '/api/admin/funnel/delete', { id });
  if (j.code !== 0) return UI.error(j.msg);
  UI.success('已删除');
  loadFunnels();
}

loadFunnels();
loadSourceStats();
</script>
</body>
</html>
