<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>站内信箱 · kefu 管理后台</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/design-system.css" />
<link rel="stylesheet" href="/admin/admin2.css" />
<style>
.inbox-layout{display:grid;grid-template-columns:1fr 360px;gap:16px;height:calc(100vh - 200px);min-height:500px}
@media (max-width:900px){.inbox-layout{grid-template-columns:1fr;height:auto}}
.msg-list{overflow-y:auto;border:1px solid var(--color-border);border-radius:8px;background:#fff}
.msg-item{padding:14px 16px;border-bottom:1px solid var(--color-border-light);cursor:pointer;transition:background .12s;display:flex;align-items:flex-start;gap:10px}
.msg-item:hover{background:var(--color-bg-2)}
.msg-item.unread{background:#FAFBFF}
.msg-item.selected{background:var(--color-primary-bg);border-left:3px solid var(--color-primary)}
.msg-item .mi-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#3B82F6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0}
.msg-item .mi-body{flex:1;min-width:0}
.msg-item .mi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.msg-item .mi-from{font-weight:600;font-size:13px}
.msg-item .mi-time{font-size:11px;color:var(--color-text-3)}
.msg-item .mi-content{font-size:13px;color:var(--color-text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-item .mi-broadcast{background:#FEF3C7;color:#B45309;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600;margin-left:6px}
.msg-item .mi-dot{width:8px;height:8px;border-radius:50%;background:var(--color-primary);margin-top:14px;flex-shrink:0}

.compose{border:1px solid var(--color-border);border-radius:8px;background:#fff;padding:16px;overflow-y:auto}
.compose h3{margin:0 0 14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.compose h3 svg{color:var(--color-primary)}
.compose .form-row{margin-bottom:12px}
.compose .form-row label{display:block;font-size:12px;color:var(--color-text-2);margin-bottom:6px;font-weight:500}
.compose .form-row select,.compose .form-row textarea{width:100%;padding:8px 10px;border:1px solid var(--color-border);border-radius:6px;font-size:13px;font-family:inherit;resize:vertical}
.compose .form-row textarea{min-height:120px}
.compose .counter{font-size:11px;color:var(--color-text-3);text-align:right;margin-top:4px}
.unread-badge{display:inline-block;background:#EF4444;color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;font-weight:600;margin-left:6px}
</style>
</head>
<body style="margin:0;padding:0;">

<div class="card" style="margin-bottom:0">
  <div class="card-title">
    <span style="display:inline-flex;align-items:center;gap:8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-primary)"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      站内信箱
      <span id="unread-badge" class="unread-badge" style="display:none">0</span>
    </span>
    <div class="extra">
      <button class="k-btn k-btn-mini" onclick="loadInbox()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        刷新
      </button>
      <button class="k-btn k-btn-mini" onclick="loadInbox({onlyUnread: !onlyUnread, p: 1})">
        <span id="btn-unread-text">只看未读</span>
      </button>
      <button class="k-btn k-btn-mini" onclick="markAllRead()">全部已读</button>
    </div>
  </div>

  <div class="inbox-layout">
    <!-- 左侧消息列表 -->
    <div class="msg-list" id="msg-list">
      <div class="k-empty">加载中…</div>
    </div>

    <!-- 右侧写邮件 -->
    <div class="compose">
      <h3>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        写消息
      </h3>
      <div class="form-row">
        <label>收件人</label>
        <select id="send-to">
          <option value="0">📢 全员广播（仅超管可发）</option>
        </select>
      </div>
      <div class="form-row">
        <label>内容</label>
        <textarea id="send-content" placeholder="请输入消息内容…" maxlength="500"></textarea>
        <div class="counter"><span id="send-count">0</span> / 500</div>
      </div>
      <button class="k-btn k-btn-primary" style="width:100%" onclick="sendMsg()">发送</button>
    </div>
  </div>
</div>

<script src="/admin/common.js?v=2026"></script>
<script>
if (!KefuAdmin.token) {
  if (parent && parent.KefuAdmin && parent.KefuAdmin.token) KefuAdmin.token = parent.KefuAdmin.token;
  else if (parent && parent.UI && parent.UI.token) KefuAdmin.token = parent.UI.token;
  else KefuAdmin.token = localStorage.getItem('kefu_token');
}
if (!KefuAdmin.token) { top.location.href = '/admin/login.html'; throw new Error('not logged in'); }
const A = KefuAdmin;
let msgs = [];
let onlyUnread = false;

function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function timeAgo(t) {
  if (!t) return '';
  const d = new Date(t.replace(/-/g, '/'));
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff/60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff/3600) + ' 小时前';
  if (diff < 604800) return Math.floor(diff/86400) + ' 天前';
  return t.substring(0, 10);
}

async function loadInbox(opts) {
  opts = opts || {};
  if (opts.p) page = opts.p;
  if (typeof opts.onlyUnread === 'boolean') onlyUnread = opts.onlyUnread;
  document.getElementById('btn-unread-text').textContent = onlyUnread ? '查看全部' : '只看未读';

  const box = document.getElementById('msg-list');
  box.innerHTML = '<div class="k-empty">加载中…</div>';
  const params = new URLSearchParams({ page: 1, size: 50 });
  if (onlyUnread) params.set('only_unread', 1);
  const r = await A.api('GET', '/api/admin/msg/inbox?' + params.toString());
  if (r.code !== 0) { box.innerHTML = '<div class="k-empty">加载失败</div>'; return; }
  msgs = (r.data && r.data.list) || [];
  if (!msgs.length) { box.innerHTML = '<div class="k-empty" style="padding:60px">' + (onlyUnread ? '没有未读消息 🎉' : '收件箱为空') + '</div>'; return; }
  box.innerHTML = msgs.map(m => {
    const isBroadcast = m.to_employee_id == 0;
    const initial = (m.from_name || m.from_username || '?').substring(0, 1);
    return `
      <div class="msg-item ${m.is_read == 0 ? 'unread' : ''}" data-id="${m.id}" onclick="markRead(${m.id})">
        <div class="mi-avatar">${escapeHtml(initial)}</div>
        <div class="mi-body">
          <div class="mi-top">
            <span class="mi-from">${escapeHtml(m.from_name || m.from_username || '系统')}
              ${isBroadcast ? '<span class="mi-broadcast">广播</span>' : ''}
            </span>
            <span class="mi-time">${escapeHtml(timeAgo(m.created_at))}</span>
          </div>
          <div class="mi-content">${escapeHtml(m.content || '')}</div>
        </div>
        ${m.is_read == 0 ? '<div class="mi-dot"></div>' : ''}
      </div>
    `;
  }).join('');
  loadUnreadCount();
}

async function loadUnreadCount() {
  const r = await A.api('GET', '/api/admin/msg/unread-count');
  if (r.code === 0) {
    const n = (r.data && r.data.unread) || 0;
    const badge = document.getElementById('unread-badge');
    if (n > 0) { badge.textContent = n; badge.style.display = 'inline-block'; }
    else { badge.style.display = 'none'; }
  }
}

async function markRead(id) {
  await A.api('POST', '/api/admin/msg/read', { id: id });
  loadInbox();
}

async function markAllRead() {
  if (!confirm('确认将所有消息标记为已读？')) return;
  const r = await A.api('POST', '/api/admin/msg/read-all');
  if (r.code === 0) {
    A.toast('已全部已读', 'success');
    loadInbox();
  }
}

async function sendMsg() {
  const to = document.getElementById('send-to').value;
  const content = document.getElementById('send-content').value.trim();
  if (!content) { A.toast('请输入内容', 'warning'); return; }
  const r = await A.api('POST', '/api/admin/msg/send', {
    to_employee_id: parseInt(to) || 0,
    content: content
  });
  if (r.code === 0) {
    A.toast('已发送', 'success');
    document.getElementById('send-content').value = '';
    document.getElementById('send-count').textContent = '0';
    loadInbox();
  } else {
    A.toast('发送失败：' + r.msg, 'error');
  }
}

// 加载员工列表作为收件人选项
async function loadEmployees() {
  // 简化：用 employee/list 端点
  const r = await A.api('GET', '/api/admin/employee/list?size=200');
  if (r.code === 0) {
    const sel = document.getElementById('send-to');
    const list = (r.data && r.data.list) || [];
    const opt = document.createElement('option');
    opt.value = '0'; opt.textContent = '📢 全员广播';
    // 替换第一个
    sel.innerHTML = '';
    sel.appendChild(opt);
    list.forEach(e => {
      const o = document.createElement('option');
      o.value = e.id;
      o.textContent = (e.real_name || e.username) + ' (' + e.username + ')';
      sel.appendChild(o);
    });
  }
}

// 字数统计
document.getElementById('send-content').addEventListener('input', e => {
  document.getElementById('send-count').textContent = e.target.value.length;
});

(async () => { await loadEmployees(); await loadInbox(); setInterval(loadUnreadCount, 30000); })();
</script>
</body>
</html>
