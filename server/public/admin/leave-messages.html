<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>访客留言 · kefu 管理后台</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/design-system.css" />
<link rel="stylesheet" href="/admin/admin2.css" />
<style>
  body { margin: 0; padding: 0; }
  .lm-stat { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 16px; }
  .lm-stat .item { background: #fff; border-radius: 10px; padding: 16px 18px; border: 1px solid var(--color-border); }
  .lm-stat .item .v { font-size: 24px; font-weight: 700; }
  .lm-stat .item .l { font-size: 12px; color: var(--color-text-3); margin-top: 4px; }
  .lm-stat .item.primary { background: linear-gradient(135deg, #0EA5E9, #0284C7); color: #fff; border: 0; }
  .lm-stat .item.primary .l { color: rgba(255,255,255,.8); }
  .lm-stat .item.warn { background: linear-gradient(135deg, #F59E0B, #D97706); color: #fff; border: 0; }
  .lm-stat .item.warn .l { color: rgba(255,255,255,.8); }
  .lm-row { padding: 12px 14px; border-bottom: 1px solid var(--color-border-light); cursor: pointer; transition: background .15s; }
  .lm-row:hover { background: var(--color-bg-2); }
  .lm-row.unread { background: #FEFCE8; }
  .lm-row.unread:hover { background: #FEF3C7; }
  .lm-row .name { font-size: 14px; font-weight: 600; }
  .lm-row .subject { font-size: 13px; margin: 4px 0; color: var(--color-text-2); }
  .lm-row .meta { font-size: 11px; color: var(--color-text-3); display: flex; gap: 12px; flex-wrap: wrap; }
  .lm-row .badge { padding: 1px 8px; border-radius: 999px; font-size: 10px; font-weight: 600; }
  .badge-new { background: #FEE2E2; color: #B91C1C; }
  .badge-replied { background: #D1FAE5; color: #047857; }
  .badge-spam { background: #F1F5F9; color: #475569; }
  .badge-closed { background: #E0E7FF; color: #3730A3; }
  .lm-detail { background: #fff; border-radius: 8px; padding: 18px; line-height: 1.7; }
  .lm-content { background: var(--color-bg-2); padding: 14px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
  .lm-reply { background: #F0FDF4; border-left: 3px solid #10B981; padding: 14px; border-radius: 4px; margin-top: 14px; }
  .lm-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .lm-form-row.three { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 768px) {
    .lm-stat { grid-template-columns: repeat(2, 1fr); }
    .lm-form-row, .lm-form-row.three { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-title">
    <span style="display:inline-flex;align-items:center;gap:8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#F59E0B"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      访客留言管理
    </span>
    <div class="extra">
      <span class="refresh-tip" id="refresh-tip">每 10 秒自动刷新</span>
      <button class="k-btn k-btn-mini" onclick="loadAll()">🔄 立即刷新</button>
    </div>
  </div>

  <div class="lm-stat" id="lm-stat">
    <div class="item primary"><div class="v" id="lm-total">-</div><div class="l">累计留言</div></div>
    <div class="item warn"><div class="v" id="lm-new">-</div><div class="l">待处理</div></div>
    <div class="item"><div class="v" id="lm-replied">-</div><div class="l">已回复</div></div>
    <div class="item"><div class="v" id="lm-spam">-</div><div class="l">垃圾</div></div>
    <div class="item"><div class="v" id="lm-closed">-</div><div class="l">已关闭</div></div>
  </div>
</div>

<div class="card">
  <div class="card-title">
    <span>留言列表</span>
    <div class="extra">
      <select id="filter-status" class="k-select" onchange="loadList(1)">
        <option value="">全部状态</option>
        <option value="new">待处理</option>
        <option value="replied">已回复</option>
        <option value="spam">垃圾</option>
        <option value="closed">已关闭</option>
      </select>
      <input id="filter-kw" class="k-input" style="width:200px" placeholder="搜索姓名/邮箱/手机/内容" />
      <button class="k-btn k-btn-mini" onclick="loadList(1)">搜索</button>
    </div>
  </div>
  <div id="lm-list" class="k-loading">加载中…</div>
  <div id="lm-page" style="padding:10px;text-align:center"></div>
</div>

<!-- 详情/回复弹窗 -->
<div id="lm-detail-mask" class="detail-mask" onclick="if(event.target.id==='lm-detail-mask')closeDetail()">
  <div class="detail-box" style="width:min(720px,90vw)">
    <div class="detail-head">
      <h3 id="lm-detail-title">留言详情</h3>
      <button class="k-btn k-btn-mini" onclick="closeDetail()">×</button>
    </div>
    <div class="detail-body" id="lm-detail-body">加载中…</div>
    <div class="detail-foot">
      <button class="k-btn k-btn-mini" onclick="updateStatus('spam')">标记垃圾</button>
      <button class="k-btn k-btn-mini" onclick="updateStatus('closed')">关闭</button>
      <!-- 修复：新增"标记已处理"按钮（无需回复直接标记处理完成） -->
      <button class="k-btn k-btn-primary k-btn-mini" onclick="updateStatus('replied')">✓ 标记已处理</button>
      <span style="flex:1"></span>
      <button class="k-btn k-btn-mini" onclick="closeDetail()">关闭</button>
    </div>
  </div>
</div>

<script src="/admin/common.js?v=2026"></script>
<script>
if (!KefuAdmin.token) {
  if (parent && parent.KefuAdmin && parent.KefuAdmin.token) KefuAdmin.token = parent.KefuAdmin.token;
  else KefuAdmin.token = localStorage.getItem('kefu_token');
}
if (!KefuAdmin.token) { top.location.href = '/admin/login.html'; throw new Error('not logged in'); }
const A = KefuAdmin;
let currentId = 0;
let currentPage = 1;

function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const STATUS_LABEL = { new:'待处理', replied:'已回复', spam:'垃圾', closed:'已关闭' };

async function loadAll() {
  // 统计
  const sr = await A.api('GET', '/api/admin/leave-message/stats');
  if (sr.code === 0) {
    const d = sr.data || {};
    document.getElementById('lm-total').textContent = d.total || 0;
    document.getElementById('lm-new').textContent = d.new || 0;
    document.getElementById('lm-replied').textContent = d.replied || 0;
    document.getElementById('lm-spam').textContent = d.spam || 0;
    document.getElementById('lm-closed').textContent = d.closed || 0;
  }
  await loadList(currentPage);
}

async function loadList(page) {
  currentPage = page;
  const status = document.getElementById('filter-status').value;
  const keyword = document.getElementById('filter-kw').value.trim();
  let path = '/api/admin/leave-message/list?page=' + page + '&size=20';
  if (status) path += '&status=' + status;
  if (keyword) path += '&keyword=' + encodeURIComponent(keyword);
  const r = await A.api('GET', path);
  const box = document.getElementById('lm-list');
  box.classList.remove('k-loading');
  if (r.code !== 0) { box.innerHTML = '<div style="padding:40px;text-align:center;color:var(--color-text-3)">加载失败</div>'; return; }
  const list = r.data.list || [];
  const total = r.data.total || 0;
  if (!list.length) {
    box.innerHTML = '<div style="padding:60px 20px;text-align:center;color:var(--color-text-3)">暂无留言</div>';
    document.getElementById('lm-page').innerHTML = '';
    return;
  }
  box.innerHTML = list.map(m => {
    const isNew = m.status === 'new';
    const time = (m.created_at || '').substring(0, 16).replace('T', ' ');
    return `
      <div class="lm-row ${isNew ? 'unread' : ''}" onclick="openDetail(${m.id})">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div style="flex:1;min-width:0">
            <div class="name">
              ${escapeHtml(m.visitor_name || '匿名访客')}
              ${m.visitor_email ? '<span style="font-size:12px;color:var(--color-text-3);font-weight:normal;margin-left:6px">&lt;' + escapeHtml(m.visitor_email) + '&gt;</span>' : ''}
              ${m.visitor_phone ? '<span style="font-size:12px;color:var(--color-text-3);font-weight:normal;margin-left:6px">📞 ' + escapeHtml(m.visitor_phone) + '</span>' : ''}
              <span class="badge badge-${m.status}">${STATUS_LABEL[m.status] || m.status}</span>
              <span class="badge" style="background:${m.priority==='high'?'#FEE2E2':'#F1F5F9'};color:${m.priority==='high'?'#B91C1C':'#475569'}">优先级: ${({low:'低',normal:'中',high:'高'}[m.priority]||'中')}</span>
            </div>
            <div class="subject">${m.subject ? '【' + escapeHtml(m.subject) + '】' : ''}${escapeHtml(m.content.substring(0, 120))}${m.content.length > 120 ? '...' : ''}</div>
            <div class="meta">
              <span>🕐 ${escapeHtml(time)}</span>
              <span>📡 来源: ${escapeHtml(m.source || 'web')}</span>
              ${m.session_id ? '<span>🔗 会话: ' + escapeHtml(m.session_id.substring(0,12)) + '…</span>' : ''}
              ${m.ip ? '<span>🌐 IP: ' + escapeHtml(m.ip) + '</span>' : ''}
              ${m.reply_by_name ? '<span>💬 ' + escapeHtml(m.reply_by_name) + ' 已回复</span>' : ''}
            </div>
          </div>
          <div style="color:var(--color-text-3);font-size:11px;margin-left:14px;white-space:nowrap">#${m.id}</div>
        </div>
      </div>
    `;
  }).join('');

  // 分页
  const totalPages = Math.ceil(total / 20);
  let html = '';
  if (totalPages > 1) {
    html += `<button class="k-btn k-btn-mini" ${page<=1?'disabled':''} onclick="loadList(${page-1})">‹ 上一页</button>`;
    html += `<span style="margin:0 10px">第 ${page} / ${totalPages} 页 · 共 ${total} 条</span>`;
    html += `<button class="k-btn k-btn-mini" ${page>=totalPages?'disabled':''} onclick="loadList(${page+1})">下一页 ›</button>`;
  }
  document.getElementById('lm-page').innerHTML = html;

  document.getElementById('refresh-tip').textContent = '已刷新 ' + new Date().toLocaleTimeString() + ' · 每 10 秒自动刷新';
}

async function openDetail(id) {
  currentId = id;
  const r = await A.api('GET', '/api/admin/leave-message/detail?id=' + id);
  if (r.code !== 0) { A.toast('加载失败', 'error'); return; }
  const m = r.data;
  document.getElementById('lm-detail-title').innerHTML = `#${m.id} · ${escapeHtml(m.visitor_name || '匿名访客')} <span class="badge badge-${m.status}" style="margin-left:6px">${STATUS_LABEL[m.status]}</span>`;
  let meta = [];
  meta.push('来源: ' + (m.source || 'web'));
  meta.push('时间: ' + (m.created_at || ''));
  if (m.visitor_email) meta.push('📧 ' + m.visitor_email);
  if (m.visitor_phone) meta.push('📞 ' + m.visitor_phone);
  if (m.session_id) meta.push('🔗 会话: ' + m.session_id);
  if (m.ip) meta.push('🌐 ' + m.ip);

  let customMeta = '';
  if (m.visitor_meta && Object.keys(m.visitor_meta).length) {
    customMeta = '<div style="background:#F8FAFC;padding:10px;border-radius:6px;margin-top:10px;font-size:12px">';
    customMeta += '<strong>📎 访客自定义信息：</strong><br/>';
    Object.entries(m.visitor_meta).forEach(([k, v]) => {
      customMeta += `<span style="color:var(--color-text-3)">${escapeHtml(k)}：</span>${escapeHtml(v)}　`;
    });
    customMeta += '</div>';
  }

  let replyHtml = '';
  if (m.reply_content) {
    replyHtml = `<div class="lm-reply">
      <strong>💬 回复 by ${escapeHtml(m.reply_by_name || '客服')} · ${escapeHtml((m.reply_at||'').substring(0,16))}</strong>
      <div style="margin-top:6px;white-space:pre-wrap">${escapeHtml(m.reply_content)}</div>
    </div>`;
  }

  document.getElementById('lm-detail-body').innerHTML = `
    <div class="lm-detail">
      <div class="lm-form-row" style="margin-bottom:14px">
        <div><span style="color:var(--color-text-3);font-size:12px">${meta.slice(0, Math.ceil(meta.length/2)).join(' · ')}</span></div>
        <div style="text-align:right"><span style="color:var(--color-text-3);font-size:12px">${meta.slice(Math.ceil(meta.length/2)).join(' · ')}</span></div>
      </div>
      ${m.subject ? '<div style="font-size:15px;font-weight:600;margin-bottom:10px">【' + escapeHtml(m.subject) + '】</div>' : ''}
      <div class="lm-content">${escapeHtml(m.content)}</div>
      ${customMeta}
      ${replyHtml}
      <div style="margin-top:18px;border-top:1px dashed var(--color-border);padding-top:18px">
        <div style="font-size:13px;font-weight:600;margin-bottom:8px">📤 回复留言</div>
        <textarea id="lm-reply-text" class="k-input" rows="4" placeholder="请输入回复内容…"></textarea>
        <div style="margin-top:8px;text-align:right">
          <button class="k-btn k-btn-primary k-btn-mini" onclick="submitReply()">📨 提交回复</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('lm-detail-mask').classList.add('open');
}

function closeDetail() {
  document.getElementById('lm-detail-mask').classList.remove('open');
}

async function submitReply() {
  const text = document.getElementById('lm-reply-text').value.trim();
  if (!text) { A.toast('请输入回复内容', 'warning'); return; }
  const r = await A.api('POST', '/api/admin/leave-message/reply', { id: currentId, reply_content: text });
  if (r.code === 0) {
    A.toast('已回复', 'success');
    closeDetail();
    loadAll();
  } else {
    A.toast('回复失败：' + r.msg, 'error');
  }
}

async function updateStatus(status) {
  const r = await A.api('POST', '/api/admin/leave-message/update', { id: currentId, status: status });
  if (r.code === 0) {
    A.toast('已更新', 'success');
    closeDetail();
    loadAll();
  } else {
    A.toast('更新失败：' + r.msg, 'error');
  }
}

(async () => {
  await loadAll();
  setInterval(loadAll, 10000);
})();
</script>
</body>
</html>
