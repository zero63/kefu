<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>部门管理 · kefu 管理后台</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/design-system.css" />
<link rel="stylesheet" href="/admin/admin2.css" />
<style>
.dept-tree{padding:8px 0}
.dept-row{display:flex;align-items:center;padding:10px 14px;border-radius:8px;transition:background .15s}
.dept-row:hover{background:var(--color-primary-bg)}
.dept-row .toggle{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--color-text-3);margin-right:6px;font-size:11px}
.dept-row .toggle.invisible{visibility:hidden}
.dept-row .name{flex:1;font-weight:500;color:var(--color-text)}
.dept-row .meta{font-size:12px;color:var(--color-text-3);margin-right:16px}
.dept-row .ops{display:flex;gap:8px;opacity:0;transition:opacity .15s}
.dept-row:hover .ops{opacity:1}
.dept-children{margin-left:24px;border-left:1px dashed var(--color-border);padding-left:0}
.k-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.k-pill-blue{background:var(--color-primary-bg);color:var(--color-primary)}
.k-pill-gray{background:#F1F5F9;color:#475569}
</style>
</head>
<body style="margin:0;padding:0;">

<div class="card">
  <div class="card-title">
    <span style="display:inline-flex;align-items:center;gap:8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-primary)"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      部门架构
    </span>
    <div class="extra">
      <button class="k-btn k-btn-primary" onclick="openDeptDialog()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建部门
      </button>
    </div>
  </div>
  <div id="dept-list" class="k-loading">加载中…</div>
</div>

<!-- 部门编辑弹窗 -->
<div id="dept-dialog" class="k-dialog-mask" style="display:none">
  <div class="k-dialog" style="max-width:480px">
    <div class="k-dialog-title" id="dlg-title">新建部门</div>
    <div class="k-dialog-body">
      <input type="hidden" id="dlg-id" />
      <div class="k-form-item">
        <label>部门名称 <span style="color:#EF4444">*</span></label>
        <input id="dlg-name" class="k-input" placeholder="例：技术部" maxlength="50" />
      </div>
      <div class="k-form-item">
        <label>编码</label>
        <input id="dlg-code" class="k-input" placeholder="例：tech（选填）" maxlength="50" />
      </div>
      <div class="k-form-item">
        <label>上级部门</label>
        <select id="dlg-parent" class="k-select"><option value="0">— 顶级 —</option></select>
      </div>
      <div class="k-form-item">
        <label>排序</label>
        <input id="dlg-sort" class="k-input" type="number" value="0" />
      </div>
    </div>
    <div class="k-dialog-foot">
      <button class="k-btn" onclick="closeDeptDialog()">取消</button>
      <button class="k-btn k-btn-primary" onclick="saveDept()">保存</button>
    </div>
  </div>
</div>

<script src="/admin/common.js?v=2026"></script>
<script>
if (!KefuAdmin.token) {
  if (parent && parent.KefuAdmin && parent.KefuAdmin.token) KefuAdmin.token = parent.KefuAdmin.token;
  else if (parent && parent.UI && parent.UI.token) KefuAdmin.token = parent.UI.token;
  else KefuAdmin.token = localStorage.getItem('kefu_token');
}
if (!KefuAdmin.token) { top.location.href = '/admin/login.html'; throw new Error('not logged in'); }
const A = KefuAdmin;
let depts = [];          // 平铺列表
let treeMap = new Map(); // id -> 子节点数组

async function loadDepts() {
  const r = await A.api('GET', '/api/admin/dept/list');
  const box = document.getElementById('dept-list');
  box.classList.remove('k-loading');
  if (r.code !== 0) { box.innerHTML = '<div class="k-empty">加载失败：' + (r.msg||'') + '</div>'; return; }
  depts = (r.data && r.data.list) || [];
  box.innerHTML = depts.length ? renderTree(buildTree(depts)) : '<div class="k-empty">暂无部门，请点击右上角创建</div>';
}

// 构造树
function buildTree(list) {
  treeMap = new Map();
  const roots = [];
  list.forEach(d => treeMap.set(d.id, { ...d, children: [] }));
  list.forEach(d => {
    if (d.parent_id && treeMap.has(d.parent_id)) treeMap.get(d.parent_id).children.push(treeMap.get(d.id));
    else roots.push(treeMap.get(d.id));
  });
  // 按 sort 排序
  const sortFn = (a,b) => (a.sort||0)-(b.sort||0) || a.id-b.id;
  roots.sort(sortFn);
  treeMap.forEach(n => n.children.sort(sortFn));
  return roots;
}

// 渲染树形结构（缩进式而非嵌套DOM）
function renderTree(roots, depth = 0) {
  let html = '<div class="dept-tree">';
  const walk = (nodes, lvl) => {
    nodes.forEach(n => {
      const hasChild = n.children && n.children.length > 0;
      html += `<div class="dept-row" style="padding-left:${14 + lvl*24}px">
        <span class="toggle ${hasChild?'':'invisible'}">${hasChild?'▾':'•'}</span>
        <span class="name">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;color:#94A3B8;margin-right:6px"><path d="M3 7h18v13H3z"/><path d="M3 7l3-4h12l3 4"/></svg>
          ${escapeHtml(n.dept_name)}
        </span>
        <span class="meta">${escapeHtml(n.dept_code||'')}</span>
        <span class="ops">
          <button class="k-btn k-btn-mini" onclick="openDeptDialog(${n.id})">编辑</button>
          <button class="k-btn k-btn-mini" onclick="openDeptDialog(0, ${n.id})">+ 子部门</button>
          <button class="k-btn k-btn-mini k-btn-danger" onclick="deleteDept(${n.id}, '${escapeHtml(n.dept_name)}')">删除</button>
        </span>
      </div>`;
      if (hasChild) walk(n.children, lvl + 1);
    });
  };
  walk(roots, depth);
  html += '</div>';
  return html;
}

function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function openDeptDialog(id, parentId) {
  document.getElementById('dept-dialog').style.display = 'flex';
  document.getElementById('dlg-id').value = id || '';
  document.getElementById('dlg-title').textContent = id ? '编辑部门' : '新建部门';
  // 填充上级部门下拉
  const sel = document.getElementById('dlg-parent');
  sel.innerHTML = '<option value="0">— 顶级 —</option>' +
    depts.map(d => `<option value="${d.id}">${escapeHtml(d.dept_name)}</option>`).join('');
  if (id) {
    const d = depts.find(x => x.id == id);
    document.getElementById('dlg-name').value = d.dept_name || '';
    document.getElementById('dlg-code').value = d.dept_code || '';
    document.getElementById('dlg-parent').value = d.parent_id || 0;
    document.getElementById('dlg-sort').value = d.sort || 0;
  } else {
    document.getElementById('dlg-name').value = '';
    document.getElementById('dlg-code').value = '';
    document.getElementById('dlg-parent').value = parentId || 0;
    document.getElementById('dlg-sort').value = 0;
  }
}
function closeDeptDialog() { document.getElementById('dept-dialog').style.display = 'none'; }

async function saveDept() {
  const id = document.getElementById('dlg-id').value;
  const name = document.getElementById('dlg-name').value.trim();
  if (!name) { A.toast('请输入部门名称', 'warning'); return; }
  const body = {
    dept_name: name,
    dept_code: document.getElementById('dlg-code').value.trim(),
    parent_id: parseInt(document.getElementById('dlg-parent').value) || 0,
    sort: parseInt(document.getElementById('dlg-sort').value) || 0,
  };
  const url = id ? '/api/admin/dept/update' : '/api/admin/dept/create';
  if (id) body.id = parseInt(id);
  const r = await A.api('POST', url, body);
  if (r.code === 0) {
    A.toast(id ? '已更新' : '已创建', 'success');
    closeDeptDialog();
    loadDepts();
  } else {
    A.toast('保存失败：' + r.msg, 'error');
  }
}

async function deleteDept(id, name) {
  if (!confirm('确认删除部门「' + name + '」？\n（若存在子部门或员工，需先调整）')) return;
  const r = await A.api('POST', '/api/admin/dept/delete', { id: parseInt(id) });
  if (r.code === 0) {
    A.toast('已删除', 'success');
    loadDepts();
  } else {
    A.toast('删除失败：' + r.msg, 'error');
  }
}

loadDepts();
</script>
</body>
</html>
