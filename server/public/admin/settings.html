<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>企业设置 · kefu 管理后台</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/design-system.css" />
<link rel="stylesheet" href="/admin/admin2.css" />
<style>
.settings-tabs{display:flex;gap:0;border-bottom:1px solid var(--color-border);margin-bottom:20px}
.settings-tabs .tab{padding:10px 18px;cursor:pointer;font-size:14px;color:var(--color-text-3);border-bottom:2px solid transparent;transition:all .15s}
.settings-tabs .tab:hover{color:var(--color-text)}
.settings-tabs .tab.active{color:var(--color-primary);border-color:var(--color-primary);font-weight:600}
.tab-pane{display:none}
.tab-pane.active{display:block}
.k-form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 24px}
@media (max-width:760px){.k-form-grid{grid-template-columns:1fr}}
.k-help{font-size:12px;color:var(--color-text-3);margin-top:4px}
.k-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.k-pill-blue{background:var(--color-primary-bg);color:var(--color-primary)}
.k-pill-gray{background:#F1F5F9;color:#475569}
.k-pill-green{background:#ECFDF5;color:#059669}
.k-pill-red{background:#FEF2F2;color:#DC2626}
.toggle{position:relative;display:inline-block;width:38px;height:22px}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#CBD5E1;transition:.2s;border-radius:22px}
.toggle .slider:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background:#fff;transition:.2s;border-radius:50%}
.toggle input:checked + .slider{background:var(--color-primary)}
.toggle input:checked + .slider:before{transform:translateX(16px)}
</style>
</head>
<body style="margin:0;padding:0;">

<div class="card">
  <div class="card-title">
    <span style="display:inline-flex;align-items:center;gap:8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-primary)"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/></svg>
      企业设置
    </span>
    <div class="extra">
      <button class="k-btn k-btn-primary" onclick="saveAll()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        保存全部
      </button>
    </div>
  </div>

  <div id="root" class="k-loading">加载中…</div>
</div>

<script src="/admin/common.js?v=2026"></script>
<script>
if (!KefuAdmin.token) {
  if (parent && parent.KefuAdmin && parent.KefuAdmin.token) KefuAdmin.token = parent.KefuAdmin.token;
  else if (parent && parent.UI && parent.UI.token) KefuAdmin.token = parent.UI.token;
  else KefuAdmin.token = localStorage.getItem('kefu_token');
}
if (!KefuAdmin.token) { top.location.href = '/admin/login.html'; throw new Error('not logged in'); }
const A = KefuAdmin;
let tenant = {};
let config = {};
let defaults = {};

function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function activateTab(name) {
  document.querySelectorAll('.settings-tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + name));
}

async function loadAll() {
  const [r1, r2] = await Promise.all([
    A.api('GET', '/api/admin/tenant/info'),
    A.api('GET', '/api/admin/tenant/default-config'),
  ]);
  const box = document.getElementById('root');
  if (r1.code !== 0 || r2.code !== 0) {
    box.innerHTML = '<div class="k-empty">加载失败</div>'; return;
  }
  tenant = (r1.data && r1.data.tenant) || {};
  config = (r1.data && r1.data.config) || {};
  defaults = (r2.data && r2.data.defaults) || {};
  box.classList.remove('k-loading');
  render();
}

function render() {
  const html = `
    <div class="settings-tabs">
      <div class="tab active" data-tab="basic" onclick="activateTab('basic')">企业信息</div>
      <div class="tab" data-tab="session" onclick="activateTab('session')">会话规则</div>
      <div class="tab" data-tab="msg" onclick="activateTab('msg')">消息/评价</div>
      <div class="tab" data-tab="work" onclick="activateTab('work')">工作时间</div>
    </div>

    <!-- 企业信息 -->
    <div class="tab-pane active" id="pane-basic">
      <div class="k-form-grid">
        <div class="k-form-item">
          <label>企业编码</label>
          <input class="k-input" disabled value="${escapeHtml(tenant.tenant_code || '')}" />
          <div class="k-help">企业创建后不可修改</div>
        </div>
        <div class="k-form-item">
          <label>企业名称</label>
          <input id="cfg-tenant_name" class="k-input" value="${escapeHtml(tenant.tenant_name || '')}" />
        </div>
        <div class="k-form-item">
          <label>联系人</label>
          <input id="cfg-contact_name" class="k-input" value="${escapeHtml(tenant.contact_name || '')}" />
        </div>
        <div class="k-form-item">
          <label>联系电话</label>
          <input id="cfg-contact_phone" class="k-input" value="${escapeHtml(tenant.contact_phone || '')}" />
        </div>
        <div class="k-form-item">
          <label>联系邮箱</label>
          <input id="cfg-contact_email" class="k-input" value="${escapeHtml(tenant.contact_email || '')}" />
        </div>
        <div class="k-form-item">
          <label>套餐</label>
          <input class="k-input" disabled value="${escapeHtml(tenant.plan || 'standard')}" />
        </div>
        <div class="k-form-item">
          <label>到期时间</label>
          <input class="k-input" disabled value="${escapeHtml(tenant.expire_at || '')}" />
        </div>
      </div>
    </div>

    <!-- 会话规则 -->
    <div class="tab-pane" id="pane-session">
      <div class="k-form-grid">
        <div class="k-form-item">
          <label>客户无操作超时（分钟）</label>
          <input id="cfg-session_timeout_min" class="k-input" type="number" min="5" max="1440" value="${configVal('session_timeout_min', 30)}" />
          <div class="k-help">超过此时长未活动，自动关闭会话</div>
        </div>
        <div class="k-form-item">
          <label>首次响应目标时长（秒）</label>
          <input id="cfg-first_response_sec" class="k-input" type="number" min="10" max="3600" value="${configVal('first_response_sec', 60)}" />
        </div>
        <div class="k-form-item">
          <label>单客服最大并发</label>
          <input id="cfg-max_queue_per_agent" class="k-input" type="number" min="1" max="50" value="${configVal('max_queue_per_agent', 5)}" />
        </div>
        <div class="k-form-item">
          <label>机器人兜底转人工</label>
          <label class="toggle">
            <input id="cfg-robot_fallback_human" type="checkbox" ${configVal('robot_fallback_human', 1) == 1 ? 'checked' : ''} />
            <span class="slider"></span>
          </label>
          <div class="k-help">机器人无法回答时自动转人工</div>
        </div>
        <div class="k-form-item">
          <label>启用敏感词过滤</label>
          <label class="toggle">
            <input id="cfg-enable_sensitive_check" type="checkbox" ${configVal('enable_sensitive_check', 1) == 1 ? 'checked' : ''} />
            <span class="slider"></span>
          </label>
        </div>
        <div class="k-form-item">
          <label>立即执行超时清理</label>
          <button class="k-btn k-btn-primary" onclick="runCron()">手动关闭超时会话</button>
          <div class="k-help">无需等待后台 Cron，立即关闭已超过时长的会话</div>
        </div>
      </div>
    </div>

    <!-- 消息/评价 -->
    <div class="tab-pane" id="pane-msg">
      <div class="k-form-grid">
        <div class="k-form-item" style="grid-column:span 2">
          <label>欢迎语</label>
          <textarea id="cfg-welcome_msg" class="k-input" rows="2">${escapeHtml(configVal('welcome_msg', ''))}</textarea>
          <div class="k-help">访客首次接入会话时展示</div>
        </div>
        <div class="k-form-item" style="grid-column:span 2">
          <label>离线语</label>
          <textarea id="cfg-offline_msg" class="k-input" rows="2">${escapeHtml(configVal('offline_msg', ''))}</textarea>
          <div class="k-help">非工作时间访客接入时展示</div>
        </div>
        <div class="k-form-item">
          <label>开启会话评价</label>
          <label class="toggle">
            <input id="cfg-enable_evaluate" type="checkbox" ${configVal('enable_evaluate', 1) == 1 ? 'checked' : ''} />
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <!-- 工作时间 -->
    <div class="tab-pane" id="pane-work">
      <div class="k-form-grid">
        <div class="k-form-item">
          <label>开始时间</label>
          <input id="cfg-working_hours_start" class="k-input" type="time" value="${escapeHtml(configVal('working_hours_start', '09:00'))}" />
        </div>
        <div class="k-form-item">
          <label>结束时间</label>
          <input id="cfg-working_hours_end" class="k-input" type="time" value="${escapeHtml(configVal('working_hours_end', '21:00'))}" />
        </div>
        <div class="k-form-item" style="grid-column:span 2">
          <div class="k-help">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            非工作时间，访客将看到「离线语」并自动进入留言模式
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('root').innerHTML = html;
}

function configVal(key, def) {
  return config[key] !== undefined ? config[key] : def;
}

async function runCron() {
  if (!confirm('立即关闭所有超时会话？此操作不可撤销。')) return;
  A.toast('执行中...', 'info');
  const r = await A.api('POST', '/api/admin/cron/close-expired');
  if (r.code === 0) {
    A.toast(r.msg + (r.data && r.data.closed ? `（${r.data.closed} 条）` : ''), 'success');
  } else {
    A.toast('执行失败：' + r.msg, 'error');
  }
}

async function saveAll() {
  // 1. 企业基础信息
  const tname = document.getElementById('cfg-tenant_name').value.trim();
  const cname = document.getElementById('cfg-contact_name').value.trim();
  const cphone = document.getElementById('cfg-contact_phone').value.trim();
  const cemail = document.getElementById('cfg-contact_email').value.trim();
  const r1 = await A.api('POST', '/api/admin/tenant/update', {
    tenant_name: tname, contact_name: cname, contact_phone: cphone, contact_email: cemail
  });
  if (r1.code !== 0) { A.toast('保存企业信息失败：' + r1.msg, 'error'); return; }

  // 2. 各项配置
  const keys = [
    'session_timeout_min', 'first_response_sec', 'max_queue_per_agent',
    'robot_fallback_human', 'enable_sensitive_check',
    'welcome_msg', 'offline_msg', 'enable_evaluate',
    'working_hours_start', 'working_hours_end',
  ];
  const items = keys.map(k => {
    const el = document.getElementById('cfg-' + k);
    if (!el) return null;
    let v = el.type === 'checkbox' ? (el.checked ? 1 : 0) : el.value;
    return { config_key: k, config_value: String(v) };
  }).filter(Boolean);

  const r2 = await A.api('POST', '/api/admin/tenant/save-config', { items: items });
  if (r2.code === 0) {
    A.toast('已保存全部设置', 'success');
    loadAll();
  } else {
    A.toast('保存配置失败：' + r2.msg, 'error');
  }
}

loadAll();
</script>
</body>
</html>
