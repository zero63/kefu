<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>黑名单 · kefu 管理后台</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/design-system.css" />
<link rel="stylesheet" href="/admin/admin2.css" />
<style>
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding:12px;background:var(--color-bg-2);border-radius:8px}
.filter-bar select,.filter-bar input{padding:6px 10px;border:1px solid var(--color-border);border-radius:6px;font-size:13px;background:#fff}

.bl-table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden}
.bl-table th{background:var(--color-bg-2);padding:12px 14px;font-weight:600;font-size:13px;color:var(--color-text-2);text-align:left;border-bottom:1px solid var(--color-border)}
.bl-table td{padding:12px 14px;border-bottom:1px solid var(--color-border-light);font-size:13px}
.bl-table tr:hover{background:var(--color-bg-2)}

.k-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.k-pill-customer{background:#DBEAFE;color:#1D4ED8}
.k-pill-ip{background:#FEF3C7;color:#B45309}
.k-pill-phone{background:#FCE7F3;color:#BE185D}
.k-pill-expired{background:#FEE2E2;color:#B91C1C;text-decoration:line-through}

.k-form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:760px){.k-form-grid{grid-template-columns:1fr}}
</style>
</head>
<body style="margin:0;padding:0;">

<div class="card">
  <div class="card-title">
    <span style="display:inline-flex;align-items:center;gap:8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#EF4444"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
      黑名单管理
    </span>
    <div class="extra" style="font-size:12px;color:var(--color-text-3)">
      屏蔽特定客户/IP/手机号，防止恶意骚扰
    </div>
  </div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:14px;background:var(--color-bg-2);border-radius:8px">
    <select id="add-type" class="k-input" style="width:130px">
      <option value="customer">客户ID</option>
      <option value="ip">IP</option>
      <option value="phone">手机号</option>
    </select>
    <input id="add-value" class="k-input" placeholder="输入要屏蔽的值" style="width:240px" />
    <input id="add-reason" class="k-input" placeholder="原因（选填）" style="width:240px" />
    <input id="add-expire" class="k-input" type="datetime-local" style="width:200px" title="过期时间（留空=永久）" />
    <button class="k-btn k-btn-danger" onclick="addBlack()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      加入黑名单
    </button>
  </div>

  <div class="filter-bar">
    <select id="f-type">
      <option value="">全部类型</option>
      <option value="customer">客户</option>
      <option value="ip">IP</option>
      <option value="phone">手机号</option>
    </select>
    <input id="f-keyword" placeholder="值 / 原因关键词" />
    <button class="k-btn k-btn-primary" onclick="loadList(1)">查询</button>
    <button class="k-btn" onclick="resetFilter()">重置</button>
  </div>

  <table class="bl-table">
    <thead>
      <tr>
        <th style="width:100px">类型</th>
        <th>屏蔽值</th>
        <th>原因</th>
        <th style="width:120px">添加人</th>
        <th style="width:140px">过期时间</th>
        <th style="width:140px">添加时间</th>
        <th style="width:80px">操作</th>
      </tr>
    </thead>
    <tbody id="bl-tbody"><tr><td colspan="7" style="text-align:center;padding:40px">加载中…</td></tr></tbody>
  </table>

  <div id="pager" style="margin-top:14px;display:flex;justify-content:space-between;align-items:center"></div>
</div>

<script src="/admin/common.js?v=2026"></script>
<script>
if (!KefuAdmin.token) {
  if (parent && parent.KefuAdmin && parent.KefuAdmin.token) KefuAdmin.token = parent.KefuAdmin.token;
  else if (parent && parent.UI && parent.UI.token) KefuAdmin.token = parent.UI.token;
  else KefuAdmin.token = localStorage.getItem('kefu_token');
}
if (!KefuAdmin.token) { top.location.href = '/admin/login.html'; throw new Error('not logged in'); }
const A = KefuAdmin;
let page = 1, size = 20, total = 0;

function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const TYPE_LABEL = { customer: '客户', ip: 'IP', phone: '手机号' };

async function loadList(p) {
  page = p || 1;
  const params = new URLSearchParams({
    page, size,
    target_type: document.getElementById('f-type').value,
    keyword: document.getElementById('f-keyword').value,
  });
  const r = await A.api('GET', '/api/admin/blacklist/list?' + params.toString());
  const tb = document.getElementById('bl-tbody');
  if (r.code !== 0) { tb.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:#EF4444">加载失败</td></tr>'; return; }
  const list = (r.data && r.data.list) || [];
  total = (r.data && r.data.total) || 0;
  if (!list.length) { tb.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--color-text-3)">暂无黑名单</td></tr>'; document.getElementById('pager').innerHTML = ''; return; }
  tb.innerHTML = list.map(b => {
    const expired = b.expire_at && new Date(b.expire_at.replace(/-/g, '/')) < new Date();
    return `
      <tr>
        <td><span class="k-pill k-pill-${b.target_type}">${TYPE_LABEL[b.target_type] || b.target_type}</span></td>
        <td><code style="font-family:monospace;${expired?'text-decoration:line-through;color:#94A3B8':''}">${escapeHtml(b.target_value)}</code>${expired?' <span class="k-pill k-pill-expired">已过期</span>':''}</td>
        <td>${escapeHtml(b.reason || '-')}</td>
        <td>${escapeHtml(b.added_by_name || '-')}</td>
        <td style="font-size:12px;color:var(--color-text-3)">${escapeHtml(b.expire_at || '永久')}</td>
        <td style="font-size:12px;color:var(--color-text-3)">${escapeHtml(b.created_at)}</td>
        <td><button class="k-btn k-btn-mini k-btn-danger" onclick="removeBl(${b.id}, '${escapeHtml(b.target_value)}')">移出</button></td>
      </tr>
    `;
  }).join('');
  renderPager();
}

function renderPager() {
  const tp = Math.max(1, Math.ceil(total / size));
  document.getElementById('pager').innerHTML = `
    <span style="font-size:12px;color:var(--color-text-3)">共 ${total} 条 / 第 ${page} / ${tp} 页</span>
    <div>
      <button class="k-btn k-btn-mini" ${page<=1?'disabled':''} onclick="loadList(${page-1})">上一页</button>
      <button class="k-btn k-btn-mini" ${page>=tp?'disabled':''} onclick="loadList(${page+1})">下一页</button>
    </div>
  `;
}

function resetFilter() {
  document.getElementById('f-type').value = '';
  document.getElementById('f-keyword').value = '';
  loadList(1);
}

async function addBlack() {
  const type = document.getElementById('add-type').value;
  const value = document.getElementById('add-value').value.trim();
  if (!value) { A.toast('请输入屏蔽值', 'warning'); return; }
  const r = await A.api('POST', '/api/admin/blacklist/add', {
    target_type: type,
    target_value: value,
    reason: document.getElementById('add-reason').value.trim(),
    expire_at: document.getElementById('add-expire').value ? document.getElementById('add-expire').value.replace('T', ' ') + ':00' : '',
  });
  if (r.code === 0) {
    A.toast('已加入黑名单', 'success');
    document.getElementById('add-value').value = '';
    document.getElementById('add-reason').value = '';
    document.getElementById('add-expire').value = '';
    loadList(1);
  } else {
    A.toast('添加失败：' + r.msg, 'error');
  }
}

async function removeBl(id, value) {
  if (!confirm('确认将「' + value + '」移出黑名单？')) return;
  const r = await A.api('POST', '/api/admin/blacklist/remove', { id: id });
  if (r.code === 0) { A.toast('已移出', 'success'); loadList(page); }
  else A.toast('移出失败：' + r.msg, 'error');
}

loadList(1);
</script>
</body>
</html>
