<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>访客 Demo 7 kefu</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<link rel="stylesheet" href="/design-system.css?v=20260808" />
<style>
* { box-sizing: border-box; }
body { margin: 0; background: linear-gradient(135deg, #FAF5FF 0%, #F5F3FF 50%, #ECFEFF 100%); min-height: 100vh; padding: 24px 16px; }
.shell { max-width: 520px; margin: 0 auto; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.brand .logo { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #7C3AED, #5B21B6); display: flex; align-items: center; justify-content: center; color: white; font-size: 16px; }
.header .actions { display: flex; gap: 6px; }
.header .actions a { color: var(--color-text-2); font-size: 12px; padding: 6px 12px; border-radius: var(--r-md); background: rgba(255,255,255,0.6); }
.header .actions a:hover { background: var(--color-card); }

/* === 模式指示 === */
.mode-bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--color-card); border-radius: var(--r-md) var(--r-md) 0 0; box-shadow: var(--shadow-card); border-bottom: 1px solid var(--color-muted); }
.mode-bar .ai { display: flex; align-items: center; gap: 8px; }
.mode-bar .ai .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #7C3AED, #5B21B6); display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; font-weight: 700; overflow: hidden; }
.mode-bar .ai .avatar img { width: 100%; height: 100%; object-fit: cover; }
.mode-bar .ai .info .name { font-weight: 600; font-size: 14px; }
.mode-bar .ai .info .role { font-size: 11px; color: var(--color-text-3); display: flex; align-items: center; gap: 4px; }
.mode-bar .ai .info .role .k-dot { background: var(--color-success); }
.mode-bar .mode-text { flex: 1; }
.mode-bar .handoff-btn { padding: 6px 12px; background: var(--color-accent); color: white; border: none; border-radius: var(--r-md); font-size: 12px; cursor: pointer; transition: all var(--t-fast); }
.mode-bar .handoff-btn:hover { background: var(--color-accent-hover); }

/* === 聊天区（消息 vs 输入 6:4） === */
.chat-card { background: var(--color-card); border-radius: 0 0 var(--r-md) var(--r-md); box-shadow: var(--shadow-card); min-height: 600px; display: flex; flex-direction: column; }
.messages { flex: 6 1 0; min-height: 0; overflow-y: auto; padding: 20px; background: linear-gradient(180deg, #FAF5FF 0%, #FFFFFF 200px); }
.messages .sys-event { text-align: center; margin: 16px 0; font-size: 12px; color: var(--color-text-3); }

/* 消息行通用 */
.msg-row { display: flex; align-items: flex-start; margin-bottom: 14px; gap: 8px; }
.msg-row.row-customer { flex-direction: row-reverse; }
.msg-row .av { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 13px; background: linear-gradient(135deg, #0891B2, #155E75); }
.msg-row .av img { width: 100%; height: 100%; object-fit: cover; }
.msg-row .av.av-ai { background: linear-gradient(135deg, #7C3AED, #5B21B6) !important; }
.msg-row .av.av-customer { background: linear-gradient(135deg, #EC4899, #BE185D) !important; }
.msg-row .av.av-agent { background: linear-gradient(135deg, #0E7490, #155E75) !important; }
.msg-row .col { max-width: 78%; display: flex; flex-direction: column; }
.msg-row.row-customer .col { align-items: flex-end; }
.msg-row .meta { font-size: 11px; color: var(--color-text-3); margin-bottom: 4px; }
.msg-row .bubble { padding: 10px 14px; border-radius: var(--r-md); font-size: 14px; line-height: 1.55; max-width: 100%; word-wrap: break-word; }
.msg-row.msg-ai .bubble { background: linear-gradient(135deg, var(--color-ai-bg), #F5F3FF); border: 1px solid #DDD6FE; }
.msg-row.msg-ai .meta { color: var(--color-ai); font-weight: 600; }
.msg-row.msg-customer .bubble { background: linear-gradient(135deg, var(--color-human-bg), #ECFEFF); border: 1px solid #A5F3FC; }
.msg-row.msg-customer .meta { color: var(--color-human); font-weight: 600; }
.msg-row.msg-agent .bubble { background: linear-gradient(135deg, #ECFEFF, #CFFAFE); border: 1px solid #67E8F9; }
.msg-row.msg-agent .meta { color: #0E7490; font-weight: 600; }
.msg-system { background: var(--color-warning-bg); text-align: center; color: var(--color-warning); font-size: 12px; padding: 6px 12px; border-radius: var(--r-md); margin: 8px 0; }

/* === 打字指示器 === */
.typing-bubble { display: inline-flex; gap: 4px; padding: 12px 16px; background: var(--color-ai-bg); border-radius: var(--r-md); margin: 8px 0; }
.typing-bubble span { width: 6px; height: 6px; background: var(--color-ai); border-radius: 50%; animation: kPulse 1.2s ease-in-out infinite; }
.typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
.typing-bubble span:nth-child(3) { animation-delay: 0.3s; }
@keyframes kPulse { 0%, 60%, 100% { transform: scale(1); opacity: 0.5; } 30% { transform: scale(1.4); opacity: 1; } }

/* === 输入区（消息 vs 输入 6:4，输入区占 40%） === */
.input-area { padding: 8px 18px 12px; border-top: 1px solid var(--color-muted); background: var(--color-card); flex: 4 1 0; min-height: 0; display: flex; flex-direction: column; }

/* === 工具行 === */
.input-area .input-row-tools { display: flex; gap: 4px; align-items: center; justify-content: flex-start; padding: 4px 0; margin-bottom: 4px; flex-shrink: 0; }

/* === 快捷回复开关 + 提示文字行 === */
.input-area .input-row-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; padding: 0 4px; min-height: 24px; flex-shrink: 0; }
.input-area .input-row-meta .muted-tip { font-size: 11px; color: var(--color-text-3); white-space: nowrap; letter-spacing: 0.3px; }

.tool-icon { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 15px; color: var(--color-text-3); transition: all 0.15s; user-select: none; opacity: 0.7; }
.tool-icon:hover { background: var(--color-primary-bg); opacity: 1; }
.tool-icon.active { background: var(--color-primary); color: #fff; opacity: 1; }

/* === 快捷短语开关 === */
.quick-toggle { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: var(--r-pill); background: transparent; color: var(--color-text-3); font-size: 12px; cursor: pointer; transition: all var(--t-fast); white-space: nowrap; }
.quick-toggle:hover { background: var(--color-primary-bg); color: var(--color-primary); }
.quick-toggle.open { background: var(--color-primary); color: #fff; }

/* === 快捷回复面板 === */
.quick-panel { max-height: 200px; overflow-y: auto; background: var(--color-bg); border: 1px solid var(--color-muted); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; flex-shrink: 0; }
.quick-panel .quick-section { margin-bottom: 8px; }
.quick-panel .quick-section:last-child { margin-bottom: 0; }
.quick-panel .quick-section-title { font-size: 11px; color: var(--color-text-3); margin-bottom: 5px; font-weight: 600; letter-spacing: 0.5px; }
.quick-panel .quick-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.quick-panel .chip { padding: 4px 10px; background: var(--color-card); color: var(--color-text-1); border: 1px solid var(--color-muted); border-radius: var(--r-pill); font-size: 12px; cursor: pointer; transition: all var(--t-fast); }
.quick-panel .chip:hover { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

/* === 主输入栏 === */
.input-area .input-row-main { display: flex; align-items: flex-end; gap: 10px; position: relative; flex: 1 1 auto; min-height: 180px; }
.input-area .input-row-main textarea {
  flex: 1; min-height: 180px; max-height: 100%;
  padding: 10px 12px; border: none; border-radius: 0;
  font-size: 14.5px; line-height: 1.7; outline: none; resize: none; font-family: inherit;
  background: transparent; color: var(--color-text-1);
  box-sizing: border-box; overflow-y: auto;
}
.input-area .input-row-main textarea:focus { border: none; }
.input-area .input-row-main textarea::placeholder { color: var(--color-text-3); }

/* === 发送按钮 === */
.send-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 48px; height: 48px; min-width: 48px; padding: 0;
  border: 0; border-radius: 50%; cursor: pointer;
  background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
  color: #fff; font-size: 16px; font-weight: 600;
  box-shadow: 0 4px 12px rgba(124,58,237,0.32);
  transition: all 0.15s; flex-shrink: 0;
  align-self: flex-end;
  margin-bottom: 4px;
}
.send-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(124,58,237,0.42); }
.send-btn:active:not(:disabled) { transform: translateY(0); }
.send-btn:disabled { background: var(--color-muted); color: var(--color-text-3); cursor: not-allowed; box-shadow: none; opacity: 0.6; }
.send-btn .send-icon { font-size: 22px; line-height: 1; }
.send-btn .send-text { display: none; }
.emoji-panel { margin-top: 8px; padding: 10px; background: var(--color-bg); border-radius: var(--r-md); border: 1px solid var(--color-muted); flex-shrink: 0; }
.emoji-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; max-height: 220px; overflow-y: auto; }
.emoji-grid span { display: inline-flex; align-items: center; justify-content: center; padding: 6px; cursor: pointer; font-size: 22px; border-radius: 6px; transition: all 0.15s; }
.emoji-grid span:hover { background: var(--color-primary-bg); transform: scale(1.2); }
/* 媒体气泡 */
.bubble-media { padding: 6px; max-width: 320px; }
.bubble-media .image-thumb { display: block; max-width: 240px; max-height: 240px; border-radius: 6px; cursor: pointer; }
.bubble-media .file-card { display: flex; gap: 10px; padding: 8px 10px; min-width: 220px; align-items: center; }
.bubble-media .file-icon { font-size: 32px; flex-shrink: 0; }
.bubble-media .file-info { flex: 1; min-width: 0; }
.bubble-media .file-name { font-size: 13px; font-weight: 500; word-break: break-all; }
.bubble-media .file-size { font-size: 11px; color: var(--color-text-3); margin-top: 2px; }
.bubble-media .file-download { color: var(--color-primary); font-size: 12px; text-decoration: none; flex-shrink: 0; }
.bubble-media audio { max-width: 280px; }
.bubble-media video { max-width: 280px; border-radius: 6px; }
.bubble-emoji { font-size: 32px !important; padding: 4px 8px !important; background: transparent !important; border: none !important; }

/* === 状态栏 === */
.status-bar { padding: 8px 16px; background: var(--color-card); border-top: 1px solid var(--color-muted); font-size: 11px; color: var(--color-text-3); display: flex; justify-content: space-between; }

/* === 系统面板 === */
.sys-panel { margin-top: 16px; padding: 12px 16px; background: rgba(255,255,255,0.6); border-radius: var(--r-md); border: 1px solid var(--color-border); font-size: 12px; color: var(--color-text-2); }
.sys-panel summary { cursor: pointer; font-weight: 500; color: var(--color-primary); }
.sys-panel .kv { display: flex; gap: 12px; margin-top: 6px; }
.sys-panel code { background: var(--color-card); padding: 1px 6px; border-radius: 3px; font-family: 'Fira Code', monospace; font-size: 11px; }
</style>
</head>

<script src="/agent/common.js?v=20260808"></script>
<script>
const A = {
  token: null, sessionId: null, currentMode: 'ai',
  currentAgent: null,
  fmtDate(d) { if (!d) return '-'; const dt = new Date(d.replace ? d.replace(' ', 'T') : d); if (isNaN(dt)) return d; const p = n => String(n).padStart(2, '0'); return dt.getFullYear()+'-'+p(dt.getMonth()+1)+'-'+p(dt.getDate())+' '+p(dt.getHours())+':'+p(dt.getMinutes()); },
  escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  async api(method, url, body) {
    const opt = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opt.body = JSON.stringify(body);
    const r = await fetch(url, opt);
    return r.json();
  },
  toast(msg, type) {
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed;top:24px;right:24px;padding:12px 20px;background:white;border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,0.15);font-size:13px;z-index:9999;border-left:4px solid ' + (type==='error'?'#DC2626':type==='success'?'#10B981':'#7C3AED') + ';';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2400);
  },
};

// 已渲染消息 id 字典（去重 server msg_id）
const renderedMsgIds = {};
// 客户端发送中（client_msg_id → true），防止 poll 拉到刚发的消息重复渲染
const pendingSendMsgs = new Set();

function avatarHtml(avatar, name, fallback, kindClass) {
  const fallbackText = (fallback || (name || '?')).slice(0, 1);
  if (avatar) {
    return '<div class="av ' + (kindClass||'') + '"><img src="' + A.escapeHtml(avatar) + '" alt="" onerror="this.style.display=\'none\';this.parentNode.textContent=\'' + A.escapeHtml(fallbackText) + '\'"/></div>';
  }
  return '<div class="av ' + (kindClass||'') + '">' + A.escapeHtml(fallbackText) + '</div>';
}
function defaultCustomerAvatar(name) {
  // 修复：粉色背景 + 访客名首字（之前用 ? 占位，访客消息头像会变成通用青色）
  const text = (name || '客').slice(0, 1);
  return '<div class="av av-customer">' + A.escapeHtml(text) + '</div>';
}
function defaultAiAvatar() {
  return '<div class="av av-ai">AI</div>';
}

let visitorPollTimer = null;
function startVisitorPoll() {
  if (visitorPollTimer) return;
  let afterSeq = 0;
  visitorPollTimer = setInterval(async () => {
    if (!A.sessionId) return;
    try {
      const r = await fetch('/api/poll/visitor?session_id=' + encodeURIComponent(A.sessionId) + '&tenant_id=1&after_seq=' + afterSeq);
      const j = await r.json();
      if (j.code !== 0) return;
      for (const evt of (j.data.events || [])) {
        afterSeq = Math.max(afterSeq, evt.seq || 0);
        const p = evt.payload || {};
        if (p.session_id && p.session_id !== A.sessionId) continue;
        if (p.type === 'message') {
          if (!p.msg_id) continue;
          if (renderedMsgIds[p.msg_id]) continue;
          renderedMsgIds[p.msg_id] = true;
          // 修复：完全跳过 customer 事件（前端 H5.send 已立即渲染；poll 不重复）
          if (p.sender_type === 'customer') continue;
          // agent 消息：切到 human 模式
          if (p.sender_type === 'agent' && A.currentMode !== 'human') {
            H5.updateMode('human');
          }
          if (p.sender_type === 'agent' && p.agent_name) {
            A.currentAgent = { name: p.agent_name, avatar: p.agent_avatar || '' };
          }
          appendMsg(p.sender_type === 'agent' ? 'agent' : 'ai', p.content || '', {
            agent_name: p.agent_name, agent_avatar: p.agent_avatar,
            msg_type: p.msg_type, media_url: p.media_url,
            file_name: (function(){ try { return (p.ext_json ? (JSON.parse(p.ext_json).file_name||'') : ''); } catch(e){ return ''; } })(),
            file_size: (function(){ try { return (p.ext_json ? (JSON.parse(p.ext_json).file_size||0) : 0); } catch(e){ return 0; } })(),
          });
        } else if (p.type === 'system') {
          appendMsg('system', p.message || p.content || '');
        } else if (p.type === 'session_closed' || p.type === 'closed') {
          H5.openEvaluateModal();
        } else if (p.type === 'handoff' || p.type === 'agent_assigned') {
          H5.updateMode('human');
          if (p.agent_name) A.currentAgent = { name: p.agent_name, avatar: p.agent_avatar || '' };
          appendMsg('system', (p.message || '已为您接入人工客服') + (p.agent_name ? '：' + p.agent_name : ''));
        }
      }
    } catch (e) { /* ignore */ }
  }, 2000);
}

const H5 = {
  async init() {
    document.getElementById('upd').textContent = new Date().toLocaleString('zh-CN');
    const r = await A.api('POST', '/api/visitor/auth/h5', {});
    if (r.code !== 0) { A.toast('初始化失败：' + r.msg, 'error'); return; }
    A.sessionId = r.data.session_id;
    A.currentMode = r.data.session ? (r.data.session.serving_mode || 'ai') : 'ai';
    document.getElementById('session-id').textContent = 'session: ' + A.sessionId.slice(0, 12) + '…';
    document.getElementById('i-sid').textContent = A.sessionId;
    H5.updateMode(A.currentMode);
    if (r.data.session) H5.renderStatus(r.data.session);
    await H5.loadHistory();
    startVisitorPoll();
  },

  async loadHistory() {
    if (!A.sessionId) return;
    const r = await A.api('GET', '/api/visitor/message/history?session_id=' + A.sessionId + '&limit=50');
    if (r.code !== 0) return;
    const msgs = (r.data && r.data.messages) || [];
    msgs.forEach(m => { if (m.id) renderedMsgIds[m.id] = true; });
    let lastAgent = null;
    for (let i = msgs.length - 1; i >= 0; i--) {
      const m = msgs[i];
      if (m.sender_type === 'agent' && m.agent_name) {
        lastAgent = { name: m.agent_name, avatar: m.agent_avatar || '' };
        break;
      }
    }
    if (lastAgent) A.currentAgent = lastAgent;
    if (r.data && r.data.agent && r.data.agent.real_name) {
      A.currentAgent = { name: r.data.agent.real_name, avatar: r.data.agent.avatar || '' };
    }
    msgs.forEach(m => {
      const sender = m.sender_type === 'agent' ? 'agent'
                    : m.sender_type === 'ai' ? 'ai'
                    : m.sender_type === 'system' ? 'system'
                    : 'customer';
      appendMsg(sender, m.content || '', {
        agent_name: m.agent_name,
        agent_avatar: m.agent_avatar,
        msg_type: m.msg_type,
        media_url: m.media_url,
        file_name: (function(){ try { return (m.ext_json ? (JSON.parse(m.ext_json).file_name||'') : ''); } catch(e){ return ''; } })(),
        file_size: (function(){ try { return (m.ext_json ? (JSON.parse(m.ext_json).file_size||0) : 0); } catch(e){ return 0; } })(),
      });
    });
  },

  updateMode(mode) {
    A.currentMode = mode;
    const isAI = mode === 'ai';
    const av = document.getElementById('mode-avatar');
    const name = document.getElementById('mode-name');
    if (isAI) {
      av.innerHTML = 'AI';
      name.textContent = '智能客服 小e';
      document.getElementById('mode-role').textContent = 'AI 智能体 7 在线';
    } else if (A.currentAgent && A.currentAgent.name) {
      if (A.currentAgent.avatar) {
        av.innerHTML = '<img src="' + A.escapeHtml(A.currentAgent.avatar) + '" onerror="this.style.display=\'none\';this.parentNode.textContent=\'' + A.escapeHtml(A.currentAgent.name.slice(0,1)) + '\'"/>';
      } else {
        av.textContent = A.currentAgent.name.slice(0, 1);
      }
      name.textContent = A.currentAgent.name;
      document.getElementById('mode-role').textContent = '👤 人工服务';
    } else {
      av.textContent = '客';
      name.textContent = '人工客服';
      document.getElementById('mode-role').textContent = '👤 人工服务';
    }
    document.getElementById('btn-handoff').textContent = isAI ? '🔁 转人工' : '✓ 人工服务中';
    document.getElementById('btn-handoff').disabled = !isAI;
    document.getElementById('msg-input').placeholder = isAI ? '和 AI 智能体聊聊…' : '回复客服…';
    document.getElementById('i-mode').textContent = mode;
  },

  renderStatus(s) {
    if (s.agent_name) document.getElementById('i-agent').textContent = s.agent_name;
  },

  suggest(text) {
    document.getElementById('msg-input').value = text;
    H5.send();
  },

  async send() {
    const inp = document.getElementById('msg-input');
    const content = inp.value.trim();
    if (!content || !A.sessionId) return;
    inp.value = '';
    if (typeof vAutoResizeTextarea === 'function') vAutoResizeTextarea(inp);
    const clientMid = 'v_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    // 修复：发送时立即渲染（带 client_msg_id 占位），API 返回后用 server msg_id 替换去重
    // 这里直接渲染 1 条 customer 消息；同时将 clientMid 加入 pendingSendMsgs
    // poll 拉到对应 server msg_id 时：
    //   - 通过 msg_id 去重（renderedMsgIds）→ 不会重复渲染
    //   - 通过 pendingSendMsgs 移除占位
    appendMsg('customer', content, { client_msg_id: clientMid });
    pendingSendMsgs.add(clientMid);
    const tid = showTyping();
    const r = await A.api('POST', '/api/visitor/message/send', {
      tenant_id: 1, session_id: A.sessionId, content, type: 'text',
      client_msg_id: clientMid,
    });
    hideTyping(tid);
    if (r.code !== 0) {
      A.toast('发送失败：' + r.msg, 'error');
      // 失败时移除 pending；前端那条本地渲染保留（让用户看到自己发过）
      pendingSendMsgs.delete(clientMid);
      return;
    }
    // 修复：从 API 响应提取 server msg_id
    const dm = r.data || {};
    const myMsgId = dm.msg_id || (dm.data && (dm.data.msg_id || dm.data.id));
    if (myMsgId) {
      renderedMsgIds[myMsgId] = true;
    }
    pendingSendMsgs.delete(clientMid);
    if (dm.agent_name && A.currentMode === 'human') {
      A.currentAgent = { name: dm.agent_name, avatar: dm.agent_avatar || '' };
      H5.updateMode('human');
    }
  },

  async handoff() {
    const r = await A.api('POST', '/api/visitor/message/handoff', { tenant_id: 1, session_id: A.sessionId, reason: 'visitor_request' });
    if (r.code === 0) {
      H5.updateMode('human');
      if (r.data && r.data.agent) {
        A.currentAgent = { name: r.data.agent.name || '', avatar: r.data.agent.avatar || '' };
        H5.updateMode('human');
      }
      appendMsg('system', r.data.message || '已为您转接人工客服');
    } else {
      A.toast('转接失败：' + r.msg, 'error');
    }
  },

  evaluated: false,
  openEvaluateModal() {
    if (H5.evaluated) return;
    H5.evaluated = true;
    let chosenScore = 0;
    const stars = [1,2,3,4,5].map(i =>
      '<span class="ev-star" data-s="' + i + '" onclick="H5.chooseStar(' + i + ')">☆</span>'
    ).join('');
    showModal('🌟 请为本次服务评分', `
      <div style="text-align:center;">
        <div id="ev-stars" style="font-size:36px;color:#FBBF24;letter-spacing:4px;cursor:pointer;">${stars}</div>
        <div class="k-text-muted" style="font-size:12px;margin:6px 0 16px;" id="ev-tip">点击星星评分</div>
        <textarea id="ev-comment" placeholder="请填写您对本次服务的评价（可选）..." rows="3" style="width:100%;padding:10px;border:1px solid #E5E7EB;border-radius:8px;font-family:inherit;font-size:13px;outline:none;"></textarea>
      </div>
    `, [
      { text: '暂不评价', cls: 'k-btn-secondary', onClick: closeEvalModal },
      { text: '提交', cls: 'k-btn-primary', onClick: submitEvaluate },
    ]);
  },
  chooseStar(n) {
    H5._pickedScore = n;
    document.querySelectorAll('#ev-stars .ev-star').forEach(s => {
      const v = +s.dataset.s;
      s.textContent = v <= n ? '★' : '☆';
    });
    const tip = document.getElementById('ev-tip');
    if (tip) tip.textContent = ['😡 很不满意','😞 不满意','😐 一般','😊 满意','😍 非常满意'][n-1];
  },
  async submitEvaluate() {
    const score = H5._pickedScore || 0;
    if (!score) { A.toast('请先选择评分', 'error'); return; }
    const comment = (document.getElementById('ev-comment').value || '').trim();
    const r = await A.api('POST', '/api/evaluate/session', {
      tenant_id: 1, session_id: A.sessionId, score, comment,
    });
    closeEvalModal();
    A.toast(r.code === 0 ? '感谢您的评价！' : '评价提交失败', r.code === 0 ? 'success' : 'error');
  }
};

let _evalModalOverlay = null;
function showModal(title, html, buttons) {
  closeEvalModal();
  _evalModalOverlay = document.createElement('div');
  _evalModalOverlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.5);z-index:9000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);';
  _evalModalOverlay.innerHTML = '<div style="background:#fff;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,0.25);width:420px;max-width:92vw;overflow:hidden;">' +
    '<div style="padding:16px 20px;border-bottom:1px solid #E5E7EB;font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center;">' +
      title + '<button onclick="closeEvalModal()" style="background:transparent;border:0;font-size:22px;color:#6B7280;cursor:pointer;line-height:1;">�</button>' +
    '</div>' +
    '<div style="padding:20px;">' + html + '</div>' +
    '<div style="padding:12px 20px;border-top:1px solid #E5E7EB;display:flex;justify-content:flex-end;gap:8px;" id="_ev_footer"></div>' +
    '</div>';
  document.body.appendChild(_evalModalOverlay);
  const footer = _evalModalOverlay.querySelector('#_ev_footer');
  (buttons || []).forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'k-btn ' + (b.cls || 'k-btn-primary');
    btn.textContent = b.text;
    btn.onclick = b.onClick;
    footer.appendChild(btn);
  });
}
function closeEvalModal() { if (_evalModalOverlay && _evalModalOverlay.parentNode) _evalModalOverlay.parentNode.removeChild(_evalModalOverlay); _evalModalOverlay = null; }

function appendMsg(sender, content, opts) {
  opts = opts || {};
  const box = document.getElementById('messages');
  if (sender === 'system') {
    const div = document.createElement('div');
    div.className = 'msg-system';
    div.textContent = content;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return;
  }
  const cls = sender; // ai / agent / customer
  const row = document.createElement('div');
  row.className = 'msg-row row-' + cls + ' msg-' + cls;
  if (opts.client_msg_id) row.setAttribute('data-client-msg-id', opts.client_msg_id);

  let avHtml = '';
  let metaName = '';
  if (sender === 'ai') {
    avHtml = defaultAiAvatar();
    metaName = '🤖 智能客服 小e';
  } else if (sender === 'agent') {
    const name = opts.agent_name || (A.currentAgent && A.currentAgent.name) || '客服';
    const avatar = opts.agent_avatar || (A.currentAgent && A.currentAgent.avatar) || '';
    avHtml = avatarHtml(avatar, name, name.slice(0,1), 'av-agent');
    metaName = '👤 ' + name;
    row.setAttribute('data-agent-name', name);
  } else { // customer
    // 修复：使用真实的访客昵称首字（之前用 ? 兜底，所有访客头像都一样且不显示首字）
    const custName = (A.customerName || '访客');
    avHtml = defaultCustomerAvatar(custName);
    metaName = '👤 ' + custName;
  }

  const mt = (opts.msg_type || 'text').toLowerCase();
  const mediaUrl = opts.media_url || '';
  let bubbleHtml = '';
  if (mt === 'image' && mediaUrl) {
    bubbleHtml = '<img class="image-thumb" src="' + A.escapeHtml(mediaUrl) + '" onclick="vPreviewMedia(\'' + A.escapeHtml(mediaUrl) + '\',\'image\')" />';
  } else if (mt === 'video' && mediaUrl) {
    bubbleHtml = '<video src="' + A.escapeHtml(mediaUrl) + '" controls preload="metadata"></video>';
  } else if (mt === 'audio' && mediaUrl) {
    bubbleHtml = '<audio src="' + A.escapeHtml(mediaUrl) + '" controls preload="metadata"></audio>';
  } else if (mt === 'file' && mediaUrl) {
    const sizeText = opts.file_size ? ' 7 ' + vFormatSize(opts.file_size) : '';
    const fileName = opts.file_name || content || '文件';
    bubbleHtml = '<div class="file-card">' +
      '<span class="file-icon">📎</span>' +
      '<div class="file-info"><div class="file-name">' + A.escapeHtml(fileName) + '</div>' +
      '<div class="file-size">' + A.escapeHtml(sizeText.trim('7').trim()) + '</div></div>' +
      '<a class="file-download" href="' + A.escapeHtml(mediaUrl) + '" target="_blank" download>下载</a>' +
    '</div>';
  } else if (mt === 'emoji') {
    bubbleHtml = mediaUrl
      ? '<img src="' + A.escapeHtml(mediaUrl) + '" style="width:64px;height:64px;object-fit:contain;" />'
      : A.escapeHtml(content || '😊');
  } else {
    bubbleHtml = A.escapeHtml(content || '').replace(/\n/g, '<br>');
  }
  const bubbleCls = ['image','file','audio','video','emoji'].includes(mt) ? 'bubble bubble-media' : 'bubble';

  row.innerHTML = avHtml
    + '<div class="col">'
    + (mt === 'emoji' ? '' : '<div class="meta">' + A.escapeHtml(metaName) + '</div>')
    + '<div class="' + bubbleCls + '">' + bubbleHtml + '</div>'
    + '</div>';
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}

function vFormatSize(b) {
  if (!b) return '';
  b = +b;
  if (b < 1024) return b + ' B';
  if (b < 1048576) return Math.round(b / 1024) + ' KB';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
  return (b / 1073741824).toFixed(1) + ' GB';
}

let _vMediaPreviewEl = null;
function vPreviewMedia(url, type) {
  if (_vMediaPreviewEl) { _vMediaPreviewEl.remove(); _vMediaPreviewEl = null; }
  if (type !== 'image') return;
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9500;display:flex;align-items:center;justify-content:center;cursor:pointer;';
  ov.innerHTML = '<img src="' + A.escapeHtml(url) + '" style="max-width:92vw;max-height:92vh;border-radius:8px;" />';
  ov.onclick = () => { ov.remove(); _vMediaPreviewEl = null; };
  document.body.appendChild(ov);
  _vMediaPreviewEl = ov;
}

async function vUploadAndSend(file, msgType) {
  if (!file) return;
  if (!A.sessionId) { A.toast && A.toast('会话未就绪', 'error'); return; }
  const fd = new FormData();
  fd.append('file', file);
  const upRes = await fetch('/api/common/upload', { method: 'POST', body: fd }).then(r => r.json()).catch(() => null);
  if (!upRes || upRes.code !== 0) { A.toast && A.toast('上传失败：' + ((upRes && upRes.msg) || '未知'), 'error'); return; }
  const url = upRes.data.url;
  const clientMid = 'v_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  appendMsg('customer', file.name || '文件', {
    msg_type: msgType,
    media_url: url,
    file_name: file.name,
    file_size: file.size,
    client_msg_id: clientMid,
  });
  const r = await A.api('POST', '/api/visitor/message/send', {
    tenant_id: 1, session_id: A.sessionId,
    content: file.name || '文件',
    msg_type: msgType,
    media_url: url,
    ext: { file_name: file.name, file_size: file.size, mime: file.type, ext: upRes.data.ext },
    client_msg_id: clientMid,
  });
  if (r.code !== 0) { A.toast('发送失败：' + r.msg, 'error'); return; }
  const dm = r.data || {};
  const myMsgId = dm.msg_id || (dm.data && (dm.data.msg_id || dm.data.id));
  if (myMsgId) renderedMsgIds[myMsgId] = true;
}

function vInitTools() {
  const $ = id => document.getElementById(id);
  $('v-image').onclick = () => $('v-file-image').click();
  $('v-file-image').onchange = e => { if (e.target.files[0]) vUploadAndSend(e.target.files[0], 'image'); e.target.value = ''; };
  $('v-file').onclick = () => $('v-file-doc').click();
  $('v-file-doc').onchange = e => { if (e.target.files[0]) vUploadAndSend(e.target.files[0], 'file'); e.target.value = ''; };
  $('v-video').onclick = () => $('v-file-video').click();
  $('v-file-video').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const isAudio = (f.type || '').startsWith('audio');
    vUploadAndSend(f, isAudio ? 'audio' : 'video');
    e.target.value = '';
  };
  $('v-emoji').onclick = () => {
    const p = $('v-emoji-panel');
    const qp = $('v-quick-panel');
    const qb = $('v-quick-toggle');
    const show = p.style.display === 'none';
    p.style.display = show ? '' : 'none';
    if (qp) qp.style.display = 'none';
    if (qb) { qb.classList.remove('open'); qb.textContent = '＋ 常用短语'; }
    $('v-emoji').classList.toggle('active', show);
  };
  const EMOJIS = [
    '😀','😁','😂','🤣','😃','😄','😅','😆','😉','😊','😋','😎','😍','😘','😗','😙','😚','🙂',
    '🤗','🤩','🤔','🤨','😐','😑','😶','🙄','😏','😣','😥','😮','🤐','😯','😪','😫','😴','😌','😛',
    '😜','😝','🤤','😒','😓','😔','😕','🙃','🤑','😲','☹️','🙁','😖','😞','😟','😤','😢','😭',
    '😦','😧','😨','😩','🤯','😬','😰','😱','🥵','🥶','😳','🤪','😵','😡','😠','🤬','😷','🤒',
    '🤕','🤢','🤮','🤧','😇','🤠','🤡','🥳','🥴','🥺','🤥','🤫','🤭','🧐','🤓','😈','👿','👹','👺',
    '💀','☠️','👻','👽','👾','🤖','💩','😺','😸','😹','😻','😼','😽','🙀','😿','😾','🙈','🙉','🙊'
  ];
  const grid = $('v-emoji-grid');
  grid.innerHTML = EMOJIS.map(e => '<span data-emoji="' + e + '">' + e + '</span>').join('');
  grid.onclick = ev => {
    const t = ev.target.closest('span[data-emoji]');
    if (!t) return;
    const inp = $('msg-input');
    inp.value = (inp.value || '') + t.dataset.emoji;
    inp.focus();
    vAutoResizeTextarea(inp);
  };
  $('msg-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); H5.send(); }
  });
  $('msg-input').addEventListener('input', e => vAutoResizeTextarea(e.target));
  setTimeout(() => vAutoResizeTextarea($('msg-input')), 100);
}
function vAutoResizeTextarea(ta) {
  if (!ta) return;
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
  const btn = document.getElementById('v-send');
  if (btn) btn.disabled = !(ta.value.trim().length > 0);
}
function vToggleQuickPanel() {
  const panel = document.getElementById('v-quick-panel');
  const btn = document.getElementById('v-quick-toggle');
  const ep = document.getElementById('v-emoji-panel');
  const eb = document.getElementById('v-emoji');
  const show = panel.style.display === 'none';
  panel.style.display = show ? '' : 'none';
  if (ep) ep.style.display = 'none';
  if (eb) { eb.classList.remove('active'); }
  if (btn) btn.classList.toggle('open', show);
  btn.textContent = (show ? '＋' : '＋') + ' 常用短语';
}
vInitTools();
function showTyping() {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.id = 'typing-bubble';
  div.className = 'typing-bubble';
  div.innerHTML = '<span></span><span></span><span></span>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}
function hideTyping(t) { if (t && t.parentNode) t.parentNode.removeChild(t); }

H5.init();
</script>
