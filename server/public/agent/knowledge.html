<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>知识库 · kefu 客服工作台</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/design-system.css" />
<style>
  body { margin: 0; padding: 24px; background: #F8FAFC; font-family: -apple-system, "PingFang SC", sans-serif; }
  .container { max-width: 1200px; margin: 0 auto; }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .head h1 { font-size: 22px; margin: 0; font-weight: 700; color: #0F172A; }

  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
  .summary .card { background: white; padding: 16px 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(15,23,42,.04); }
  .summary .card .label { color: #64748B; font-size: 12px; margin-bottom: 6px; }
  .summary .card .value { font-size: 22px; font-weight: 700; color: #0F172A; }

  .test-panel { background: white; padding: 16px 20px; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(15,23,42,.04); }
  .test-panel h3 { margin: 0 0 12px; font-size: 14px; color: #0F172A; display: flex; align-items: center; gap: 6px; }
  .test-panel .row { display: flex; gap: 10px; }
  .test-panel input { flex: 1; padding: 8px 12px; border: 1px solid #E2E8F0; border-radius: 8px; font-size: 13px; outline: none; }
  .test-panel input:focus { border-color: #7C3AED; box-shadow: 0 0 0 3px rgba(124,58,237,.08); }

  .kb-grid { display: grid; grid-template-columns: 220px 1fr 1fr; gap: 16px; }
  @media (max-width: 980px) { .kb-grid { grid-template-columns: 1fr; } }

  .panel { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(15,23,42,.04); padding: 16px 20px; }
  .panel-title { font-size: 15px; font-weight: 600; color: #0F172A; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }

  .tree-item { padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: all .15s; font-size: 13px; color: #334155; }
  .tree-item:hover { background: #F5F3FF; }
  .tree-item.active { background: #F5F3FF; color: #7C3AED; font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead { background: #F8FAFC; }
  th { padding: 10px 12px; text-align: left; color: #475569; font-weight: 600; font-size: 12px; border-bottom: 1px solid #E2E8F0; }
  td { padding: 10px 12px; border-bottom: 1px solid #F1F5F9; color: #334155; vertical-align: middle; }
  tr:hover td { background: #FAFAFA; }

  .k-tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; background: #DBEAFE; color: #1D4ED8; }
  .text-muted { color: #94A3B8; font-size: 12px; }
  .k-empty { padding: 40px 20px; text-align: center; color: #94A3B8; }
  .btn-text { background: none; border: 0; color: #7C3AED; cursor: pointer; padding: 0 6px; font-size: 12px; }
  .btn-text.danger { color: #EF4444; }
  .hit-card { background: #F5F3FF; border-radius: 8px; padding: 12px 14px; margin-top: 10px; }
  .hit-card .q { font-weight: 600; color: #0F172A; margin-bottom: 4px; }
  .hit-card .a { font-size: 12px; color: #475569; }
  .hit-card .meta { font-size: 11px; color: #94A3B8; margin-top: 6px; }
</style>
</head>
<body>

<div class="container">
  <div class="head">
    <h1>📚 知识库</h1>
    <div style="font-size:12px;color:#64748B;">智能问答 · AI 自动回复素材</div>
  </div>

  <div class="summary">
    <div class="card"><div class="label">总查询数</div><div class="value" id="m-total">-</div></div>
    <div class="card"><div class="label">命中次数</div><div class="value" id="m-hit">-</div></div>
    <div class="card"><div class="label">命中率</div><div class="value" id="m-rate">-</div></div>
    <div class="card"><div class="label">意图数</div><div class="value" id="m-intent">-</div></div>
  </div>

  <div class="test-panel">
    <h3>🧪 问一问测试</h3>
    <div class="row">
      <input id="test-q" placeholder="输入问题，测试匹配效果..." />
      <button class="k-btn k-btn-primary" onclick="runTest()">测试</button>
    </div>
    <div id="test-result"></div>
  </div>

  <div class="kb-grid">
    <div class="panel">
      <div class="panel-title">
        <span>分类</span>
      </div>
      <div id="tree"><div class="k-empty">加载中...</div></div>
    </div>

    <div class="panel">
      <div class="panel-title">
        <span>问答列表 <span class="text-muted" id="filter-info"></span></span>
      </div>
      <table>
        <thead>
          <tr><th>问题</th><th style="width:90px;">意图</th><th style="width:60px;">命中</th></tr>
        </thead>
        <tbody id="q-tbody"><tr><td colspan="3" class="k-empty">加载中...</td></tr></tbody>
      </table>
    </div>

    <div class="panel">
      <div class="panel-title"><span>意图管理</span></div>
      <table>
        <thead>
          <tr><th>编码</th><th>名称</th><th style="width:80px;">动作</th></tr>
        </thead>
        <tbody id="i-tbody"><tr><td colspan="3" class="k-empty">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="/agent/common.js?v=2026"></script>
<script>
if (!KefuAgent.requireLogin()) throw new Error('not logged in');
const A = KefuAgent;
let currentCat = 0;
const esc = (s) => A.escapeHtml(s);

async function loadStats() {
  const j = await A.api('GET', '/api/admin/kb/stats');
  if (j.code === 0 && j.data) {
    const d = j.data;
    document.getElementById('m-total').textContent  = (d.total || 0).toLocaleString();
    document.getElementById('m-hit').textContent    = (d.hit_total || 0).toLocaleString();
    document.getElementById('m-rate').textContent   = (d.hit_rate || 0) + '%';
    document.getElementById('m-intent').textContent = (d.intents || []).length;
  }
}

async function loadCategories() {
  const j = await A.api('GET', '/api/admin/kb/category/list');
  const list = (j.data && j.data.list) || [];
  const tree = document.getElementById('tree');
  tree.innerHTML = '<div class="tree-item ' + (currentCat == 0 ? 'active' : '') + '" onclick="selectCat(0)">📂 全部</div>' +
    list.map(c => '<div class="tree-item ' + (currentCat == c.id ? 'active' : '') + '" onclick="selectCat(' + c.id + ')">📁 ' + esc(c.name) + '</div>').join('');
}

function selectCat(id) {
  currentCat = id;
  loadCategories();
  loadQuestions();
}

async function loadQuestions() {
  const url = '/api/admin/kb/list' + (currentCat ? '?category_id=' + currentCat : '');
  const j = await A.api('GET', url);
  const list = (j.data && j.data.list) || [];
  const tbody = document.getElementById('q-tbody');
  document.getElementById('filter-info').textContent = list.length + ' 条';
  tbody.innerHTML = list.length ? list.map(q =>
    '<tr>' +
    '<td><b>' + esc((q.question || '').slice(0, 50)) + '</b><br>' +
    '<span class="text-muted">' + esc((q.answer || '').slice(0, 80)) + '</span></td>' +
    '<td><span class="k-tag">' + esc(q.intent || '-') + '</span></td>' +
    '<td>' + (q.hit_count || 0) + '</td>' +
    '</tr>'
  ).join('') : '<tr><td colspan="3" class="k-empty">暂无问答</td></tr>';
}

async function loadIntents() {
  const j = await A.api('GET', '/api/admin/kb/intent/list');
  const list = (j.data && j.data.list) || [];
  document.getElementById('i-tbody').innerHTML = list.length ? list.map(i =>
    '<tr>' +
    '<td><code style="font-family:monospace;font-size:12px;">' + esc(i.intent_code) + '</code></td>' +
    '<td>' + esc(i.intent_name) + '</td>' +
    '<td><span class="k-tag">' + esc(i.action || '-') + '</span></td>' +
    '</tr>'
  ).join('') : '<tr><td colspan="3" class="k-empty">暂无意图</td></tr>';
}

async function runTest() {
  const q = document.getElementById('test-q').value.trim();
  if (!q) { A.toast('请输入问题', 'warning'); return; }
  const j = await A.api('POST', '/api/admin/kb/test', { question: q });
  const hits = (j.data && j.data.hits) || [];
  const box = document.getElementById('test-result');
  box.innerHTML = hits.length
    ? hits.map(h => '<div class="hit-card">' +
        '<div class="q">💡 ' + esc(h.question) + '</div>' +
        '<div class="a">' + esc(h.answer || '') + '</div>' +
        '<div class="meta">命中 ' + (h.hit_count || 0) + ' · 未中 ' + (h.miss_count || 0) + ' · 意图 ' + esc(h.intent || '-') + '</div>' +
      '</div>').join('')
    : '<div class="k-empty">未匹配到答案</div>';
  loadStats();
}

loadStats();
loadCategories();
loadQuestions();
loadIntents();
</script>
</body>
</html>
