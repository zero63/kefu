version: "3.8"

services:
  webman:
    build: .
    container_name: kefu-webman
    ports:
      - "8787:8787"
    volumes:
      - ./runtime:/app/runtime
      - ./public:/app/public
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - kefu-net

  mysql:
    image: mysql:8.0
    container_name: kefu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: kefu
      MYSQL_USER: kefu
      MYSQL_PASSWORD: adminkefu
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ukefu", "-padminkefu"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - kefu-net

  redis:
    image: redis:7-alpine
    container_name: kefu-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - kefu-net

  nginx:
    image: nginx:alpine
    container_name: kefu-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro
    depends_on:
      - webman
    restart: unless-stopped
    networks:
      - kefu-net

volumes:
  mysql-data:
  redis-data:

networks:
  kefu-net:
    driver: bridge
