  <rect x="296" y="266" width="36" height="36" rx="10" fill="#5B5BF0"/>
  <rect x="344" y="266" width="220" height="44" rx="12" fill="white" stroke="#EEF2F7"/>
  <circle cx="356" cy="282" r="3" fill="#5B5BF0"/>
