  <text x="936" y="200" font-size="11" fill="#64748B">📧 guest@example.com</text>
  <text x="936" y="216" font-size="11" fill="#64748B">🌐 IP: 192.168.1.100</text>
  <text x="936" y="232" font-size="11" fill="#64748B">💬 浏览器: Chrome 125</text>
