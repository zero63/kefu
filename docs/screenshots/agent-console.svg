  <text x="392" y="614" font-size="10" fill="#334155">退款/售后</text>
  <text x="312" y="640" font-size="10" fill="#94A3B8">是否解决</text>
  <rect x="380" y="628" width="60" height="20" rx="4" fill="#10B981" fill-opacity="0.12"/>
  <text x="396" y="642" font-size="10" fill="#10B981" font-weight="600">已解决</text>
