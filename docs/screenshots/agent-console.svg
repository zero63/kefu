    <rect x="0" y="0" width="3" height="72" fill="url(#gradA)"/>
    <rect x="16" y="16" width="32" height="32" rx="10" fill="#5B5BF0"/>
    <text x="56" y="28" fill="#0F172A" font-weight="600">访客 8c1d</text>
    <text x="220" y="28" fill="#94A3B8" font-size="10">1 分钟前</text>
    <text x="56" y="46" fill="#64748B">想咨询一下退款流程…</text>
    <circle cx="246" cy="20" r="6" fill="#EF4444"/>
    <text x="246" y="24" fill="white" font-size="8" font-weight="700" text-anchor="middle">3</text>
    <line x1="0" y1="72" x2="280" y2="72" stroke="#F8FAFC"/>
    <rect x="16" y="88" width="32" height="32" rx="10" fill="#0891B2"/>
    <text x="56" y="100" fill="#0F172A" font-weight="600">访客 f2a3</text>
    <text x="220" y="100" fill="#94A3B8" font-size="10">5 分钟前</text>
    <text x="56" y="118" fill="#64748B">你好，我想查询订单状态</text>
    <line x1="0" y1="144" x2="280" y2="144" stroke="#F8FAFC"/>
    <rect x="16" y="160" width="32" height="32" rx="10" fill="#7C3AED"/>
    <text x="56" y="172" fill="#0F172A" font-weight="600">访客 e5b7</text>
    <text x="220" y="172" fill="#94A3B8" font-size="10">8 分钟前</text>
    <text x="56" y="190" fill="#64748B">订单多久能发货？</text>
    <line x1="0" y1="216" x2="280" y2="216" stroke="#F8FAFC"/>
    <rect x="16" y="232" width="32" height="32" rx="10" fill="#10B981"/>
