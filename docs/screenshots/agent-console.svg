<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="gradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B5BF0"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="#F8FAFC"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="48" fill="white"/>
  <rect x="16" y="12" width="24" height="24" rx="6" fill="url(#gradA)"/>
