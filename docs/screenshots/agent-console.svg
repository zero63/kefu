    <text x="12" y="16" fill="#0F172A" font-weight="600">订单查询问题</text>
    <text x="12" y="32" fill="#94A3B8">2026-08-08 · 15 分钟</text>
    <rect x="0" y="48" width="248" height="40" rx="6" fill="white" stroke="#E2E8F0"/>
    <text x="12" y="64" fill="#0F172A" font-weight="600">会员权益咨询</text>
    <text x="12" y="80" fill="#94A3B8">2026-08-05 · 8 分钟</text>
    <rect x="0" y="96" width="248" height="40" rx="6" fill="white" stroke="#E2E8F0"/>
    <text x="12" y="112" fill="#0F172A" font-weight="600">物流跟踪</text>
    <text x="12" y="128" fill="#94A3B8">2026-08-01 · 12 分钟</text>
  </g>
  <line x1="936" y1="450" x2="1184" y2="450" stroke="#EEF2F7"/>
